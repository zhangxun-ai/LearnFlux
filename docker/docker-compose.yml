services:
  video-transcript-api:
    # Keep the service/container identifiers stable for existing deployments.
    image: learnflux:local
    pull_policy: build
    # The bundled Linux BBDown binary is amd64; Apple Silicon uses emulation.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: video-transcript-api
    environment:
      - TZ=Asia/Shanghai
    ports:
      # Local host access only. The container config must listen on 0.0.0.0:8000.
      - "127.0.0.1:8200:8000"
    volumes:
      # Configuration files (user must prepare before starting)
      - ../config:/app/config
      # Persistent data: cache, logs, transcription results
      - ../data:/app/data
    mem_limit: 2g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
