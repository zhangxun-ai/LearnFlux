    <main class="main-area" id="main-content">

        </header>
        <section class="page-stage">
    <h1 class="sr-only">心流写作</h1>
    <section class="focus-stage" aria-label="心流写作空间">
        <canvas id="focus-canvas" class="focus-canvas" aria-hidden="true"></canvas>
        <div class="focus-vignette" aria-hidden="true"></div>

        <section class="mode-zone" aria-label="天气模式">
            <div class="mode-switch" role="group" aria-label="切换背景模式">
                <button type="button" class="mode-button active" data-mode="rainy" aria-pressed="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14.6A7 7 0 0 1 16 8h1.4A4.6 4.6 0 0 1 20 16.4M8 15v4M12 16v5M16 15v4"/></svg>
                    <span>Rainy</span>
                </button>
                <span class="mode-divider" aria-hidden="true"></span>
                <button type="button" class="mode-button" data-mode="snowy" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M4.6 5.4l14.8 13.2M19.4 5.4 4.6 18.6M2 12h20M7 3.5l5 8.5 5-8.5M7 20.5l5-8.5 5 8.5"/></svg>
                    <span>Snowy</span>
                </button>
            </div>
        </section>

        <section class="type-zone" aria-label="字体设置">
            <button type="button" class="type-orb" aria-label="字体设置">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>
            </button>
            <aside class="type-panel" aria-label="字体与字号">
                <p class="panel-kicker">字体</p>
                <button type="button" class="type-option" data-font="serif">Serif</button>
                <button type="button" class="type-option" data-font="sans">Sans</button>
                <button type="button" class="type-option" data-font="mono">Mono</button>
                <button type="button" class="type-option active" data-font="handwriting">Klee</button>
                <div class="panel-line" aria-hidden="true"></div>
                <p class="panel-kicker">字号</p>
                <div class="size-options" role="group" aria-label="字号">
                    <button type="button" class="size-option active" data-size="small">小</button>
                    <button type="button" class="size-option" data-size="medium">中</button>
                    <button type="button" class="size-option" data-size="large">大</button>
                </div>
            </aside>
        </section>

        <section class="deck-wrap" aria-label="写作区">
            <div class="focus-deck">
                <div class="journal-meta" aria-label="记录信息">
                    <span id="journal-date-label">今天</span>
                    <select id="journal-type-select" aria-label="记录类型">
                        <option value="daily">日记</option>
                        <option value="note">随笔</option>
                        <option value="weekly_plan">周计划</option>
                        <option value="weekly_review">周复盘</option>
                        <option value="monthly_plan">月计划</option>
                        <option value="monthly_review">月复盘</option>
                    </select>
                </div>
                <textarea id="focus-editor" class="focus-editor" spellcheck="false" autocomplete="off" placeholder="开始你的心流写作..."></textarea>
                <div class="deck-actions">
                    <span class="save-status" id="save-status" aria-live="polite">Saved</span>
                    <div class="export-group">
                        <button type="button" id="focus-export" aria-haspopup="true" aria-expanded="false">Export</button>
                        <div class="export-menu" id="export-menu" role="menu">
                            <button type="button" data-export-format="txt">TXT</button>
                            <button type="button" data-export-format="md">Markdown</button>
                        </div>
                    </div>
                    <button type="button" id="focus-clear">Release</button>
                </div>
                <div class="deck-glow" aria-hidden="true"></div>
            </div>
        </section>

        <section class="mixer-zone" id="mixer-zone" aria-label="氛围控制台">
            <div class="timer-readout" id="timer-readout" aria-hidden="true">
                <span class="timer-phase" id="timer-phase">专注</span>
                <span class="timer-time" id="timer-time">25:00</span>
                <span class="timer-hint">长按重置</span>
            </div>
            <button type="button" class="mixer-orb" id="timer-toggle" aria-pressed="false" aria-label="开始或暂停番茄钟，长按重置">
                <svg class="mixer-orb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H3M21 5h-7M14 3v4M8 12H3M21 12h-9M8 10v4M12 19H3M21 19h-5M16 17v4"/></svg>
                <svg class="timer-ring" viewBox="0 0 64 64" aria-hidden="true">
                    <circle class="timer-ring-track" cx="32" cy="32" r="24"></circle>
                    <circle class="timer-ring-progress" id="timer-ring-progress" cx="32" cy="32" r="24"></circle>
                </svg>
            </button>
            <aside class="mixer-panel">
                <div class="mix-group">
                    <div class="mix-row">
                        <span class="mix-name" id="weather-name">Rain</span>
                        <span class="mix-value" id="weather-value">80%</span>
                    </div>
                    <input id="weather-slider" type="range" min="0" max="100" value="80" aria-label="背景强度">
                </div>
                <span class="mixer-divider" aria-hidden="true"></span>
                <div class="mix-group sound-group">
                    <div class="mix-row">
                        <button type="button" class="sound-current" id="sound-current" aria-haspopup="true" aria-expanded="false">
                            <span id="sound-name">Volume</span>
                        </button>
                        <span class="mix-value" id="volume-value">40%</span>
                    </div>
                    <input id="volume-slider" type="range" min="0" max="100" value="40" aria-label="背景音量">
                    <div class="sound-menu" id="sound-menu" role="menu">
                        <!-- 背景音按钮由 JS 依据 SOUNDS 配置生成 -->
                        <button type="button" id="audio-import">导入录音</button>
                    </div>
                    <input id="audio-file" type="file" accept="audio/*" hidden>
                </div>
            </aside>
        </section>

        <aside class="journal-shell" aria-label="历史和复盘">
            <div class="journal-dock" aria-label="打开侧边栏">
                <button class="journal-dock-button" type="button" data-journal-open="history" aria-controls="journal-sidecar" aria-expanded="false">历史</button>
                <button class="journal-dock-button" type="button" data-journal-open="review" aria-controls="journal-sidecar" aria-expanded="false">复盘</button>
            </div>

            <section class="journal-sidecar" id="journal-sidecar" aria-label="记录侧边栏" aria-hidden="true">
                <div class="journal-sidecar-head">
                    <div class="journal-tabs" role="tablist" aria-label="记录侧边栏">
                        <button class="journal-tab active" type="button" data-journal-tab="history" role="tab" aria-selected="true">历史</button>
                        <button class="journal-tab" type="button" data-journal-tab="review" role="tab" aria-selected="false">复盘</button>
                    </div>
                    <button class="journal-sidecar-close" id="journal-sidecar-close" type="button" aria-label="关闭侧边栏">×</button>
                </div>

                <div class="journal-panel active" data-journal-panel="history" role="tabpanel">
                    <h2>历史记录</h2>
                    <p id="journal-history-note">按日期回看记录，选中后回到对应正文。</p>
                    <div class="journal-history-list" id="journal-history-list">
                        <div class="journal-empty">正在读取本月记录...</div>
                    </div>
                </div>

                <div class="journal-panel" data-journal-panel="review" role="tabpanel" hidden>
                    <h2>AI 复盘</h2>
                    <p>需要整理时，把这段时间的记录和问题交给 AI。</p>
                    <div class="journal-review-actions">
                        <button type="button" data-review-range="week">本周复盘</button>
                        <button type="button" data-review-range="month">本月复盘</button>
                    </div>
                    <label class="journal-question-label" for="journal-review-question">这次想问 AI 的问题</label>
                    <textarea id="journal-review-question" class="journal-review-question" rows="5">我最近真正推进了什么？哪些地方反复卡住？下周最应该保留的动作是什么？</textarea>
                    <div class="journal-review-result" id="journal-review-result" aria-live="polite"></div>
                </div>
            </section>
        </aside>

        <a class="focus-exit" href="/" aria-label="返回落地页" title="返回落地页">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 18 9 12l6-6M9 12h11M5 12h.01"></path>
            </svg>
            <span>返回落地页</span>
        </a>
    </section>
        </section>
    </main>

    <script src="/static/js/focus-journal.js?v=20260709-2"></script>
