    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root, [data-theme="light"], [data-theme="dark"] {
            --hist-accent: var(--accent-primary);
            --hist-accent-hover: var(--accent-hover);
            --hist-accent-soft: var(--accent-soft);
            --hist-card: var(--bg-primary);
            --hist-card-hover: var(--bg-secondary);
            --hist-border: var(--border-primary);
            --hist-shadow: var(--shadow-sm);
            --hist-shadow-hover: var(--shadow);
            --hist-radius: 12px;
            --hist-radius-lg: 16px;
        }
        
        body {
            min-height: 100vh;
            color: var(--ink);
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

        /* 顶部 Header */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        .header a {
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: auto;
            transition: color 0.2s;
            font-weight: 500;
        }
        .header a:hover { color: var(--hist-accent); }

        /* API Key / Webhook 输入区 (Toolbar blocks) */
        .auth-bar, .alias-panel, .filter-bar {
            padding: 20px 24px;
            margin-bottom: 24px;
            /* background/border inherited from editorial.css */
        }
        
        .auth-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .auth-bar label { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
        .auth-bar input {
            flex: 1;
            min-width: 240px;
            background: var(--card-translucent-light);
            border: 1px solid var(--line);
            border-radius: var(--radius-control);
            padding: 10px 14px;
            color: var(--ink);
            font-size: 0.95rem;
            font-family: monospace;
            transition: all 0.2s;
            box-shadow: inset 0 1px 2px rgba(27, 26, 23, 0.02);
        }
        .auth-bar input:focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px var(--accent-soft); }
        
        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            border-radius: var(--hist-radius);
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--product-on-accent);
            box-shadow: 0 10px 18px -16px rgba(228, 80, 58, 0.8);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 22px -18px rgba(194, 58, 38, 0.9); background: var(--accent-ink); }
        .btn-primary:active { transform: scale(0.97); }
        
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1.5px solid var(--hist-border);
        }
        .btn-ghost:hover { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--text-tertiary); }
        
        .auth-status {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 999px;
            white-space: nowrap;
            font-weight: 600;
        }
        .auth-status.ok { background: rgba(16, 185, 129, 0.1); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .auth-status.err { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .remember-label {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .remember-label input { width: 16px; height: 16px; accent-color: var(--hist-accent); cursor: pointer; }

        /* Webhook 别名设置 */
        .alias-panel { display: none; }
        .alias-panel.visible { display: block; animation: fadeIn 0.3s ease; }
        .alias-panel h3 { font-size: 1.05rem; color: var(--text-primary); font-weight: 600; margin-bottom: 16px; }
        .alias-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .alias-url {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--hist-border);
        }
        .alias-input {
            background: var(--bg-primary);
            border: 1.5px solid var(--hist-border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 220px;
            transition: all 0.2s;
        }
        .alias-input:focus { outline: none; border-color: var(--hist-accent); box-shadow: 0 0 0 3px var(--hist-accent-soft); }
        .alias-save-hint { font-size: 0.85rem; color: var(--text-tertiary); margin-top: 12px; }

        /* 过滤栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; min-width: 160px; }
        .filter-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        .filter-group select,
        .filter-group input[type="date"] {
            background: var(--card-translucent-light);
            border: 1px solid var(--line);
            border-radius: var(--radius-control);
            padding: 10px 14px;
            color: var(--ink);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .filter-group select:focus,
        .filter-group input[type="date"]:focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px var(--accent-soft); }
        .filter-group select option { background: var(--bg-primary); }
        .filter-actions { display: flex; gap: 12px; align-items: flex-end; margin-left: auto; }

        /* 频道多选下拉 */
        .multi-select {
            background: var(--bg-primary);
            border: 1.5px solid var(--hist-border);
            border-radius: var(--hist-radius);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            transition: all 0.2s;
        }
        .multi-select:hover { border-color: var(--hist-accent); }
        .multi-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 100;
            background: var(--hist-card);
            border: 1px solid var(--hist-border);
            border-radius: var(--hist-radius);
            max-height: 280px;
            overflow-y: auto;
            min-width: 200px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            margin-top: 8px;
        }
        [data-theme="dark"] .multi-dropdown { box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
        .multi-opt {
            padding: 10px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            transition: background 0.15s;
        }
        .multi-opt:hover { background: var(--hist-accent-soft); }
        .multi-opt input { width: 16px; height: 16px; accent-color: var(--hist-accent); cursor: pointer; }

        /* 统计条 */
        .stats-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .unread-badge {
            background: var(--hist-accent);
            color: #fff;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* 任务列表 */
        .task-list { display: flex; flex-direction: column; gap: 0; }
        .task-card {
            background: transparent;
            border: 1px solid transparent;
            border-bottom: 1px solid var(--line);
            border-radius: var(--radius-card);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.2s ease;
            box-shadow: none;
            position: relative;
        }
        .task-card:last-child {
            border-bottom-color: transparent;
        }
        .task-card:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--line);
            background: var(--card-translucent-light);
        }
        .task-card.unread { border-left: 4px solid var(--accent); }
        .task-card.unread::after {
            content: '';
            position: absolute;
            top: 24px;
            right: 24px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }
        .task-card.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .row-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--hist-accent);
            cursor: pointer;
        }

        /* 卡片头部 */
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
        .task-meta { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
        .task-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-subtitle { font-size: 0.9rem; color: var(--text-secondary); display: flex; gap: 12px; flex-wrap: wrap; }
        .task-status {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            border: 1px solid transparent;
        }
        .status-completed { background: rgba(16, 185, 129, 0.1); color: #10B981; border-color: rgba(16, 185, 129, 0.2); }
        .status-failed { background: rgba(239, 68, 68, 0.1); color: #EF4444; border-color: rgba(239, 68, 68, 0.2); }
        .status-processing { background: rgba(245, 158, 11, 0.1); color: #F59E0B; border-color: rgba(245, 158, 11, 0.2); }
        .mark-badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            color: #E4503A;
            background: rgba(228, 80, 58, 0.1);
            border: 1px solid rgba(228, 80, 58, 0.2);
        }

        /* 卡片内容区 */
        .task-body { display: flex; flex-direction: column; gap: 16px; }
        .task-url {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            background: var(--bg-secondary);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--hist-border);
            word-break: break-all;
        }
        .task-url a { color: var(--hist-accent); text-decoration: none; font-weight: 500; }
        .task-url a:hover { text-decoration: underline; }
        
        .task-error {
            background: rgba(239, 68, 68, 0.05);
            border-left: 3px solid #EF4444;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #EF4444;
        }

        /* 标签 */
        .tag-list { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag {
            background: var(--bg-secondary);
            border: 1px solid var(--hist-border);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* Webhook 投递结果 */
        .webhook-results { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .wh-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--hist-border);
        }
        .wh-status {
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .wh-status.ok { background: rgba(16, 185, 129, 0.1); color: #10B981; }
        .wh-status.err { background: rgba(239, 68, 68, 0.1); color: #EF4444; }
        .wh-alias { font-weight: 600; color: var(--text-primary); }
        .wh-detail { color: var(--text-tertiary); font-family: monospace; }

        /* 卡片底部动作 */
        .task-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--hist-border);
        }

        /* 空状态与加载 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-tertiary);
            background: var(--hist-card);
            border: 1px dashed var(--hist-border);
            border-radius: var(--hist-radius-lg);
            font-size: 1.05rem;
        }
        .loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 1.05rem; }
        .error-state { text-align: center; padding: 40px 20px; color: #EF4444; background: rgba(239, 68, 68, 0.05); border-radius: var(--hist-radius-lg); }

        /* 模态框 (JSON Viewer) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--hist-card);
            border-radius: var(--hist-radius-lg);
            width: 90%; max-width: 800px; max-height: 85vh;
            display: flex; flex-direction: column;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            transform: translateY(20px) scale(0.98);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--hist-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
        .modal-close {
            background: transparent; border: none; font-size: 1.5rem;
            cursor: pointer; color: var(--text-tertiary); padding: 4px; line-height: 1;
            transition: color 0.2s;
        }
        .modal-close:hover { color: var(--hist-accent); }
        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
            background: var(--bg-secondary);
        }
        .modal-body pre {
            white-space: pre-wrap; word-break: break-all;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.9rem; color: var(--text-primary);
            line-height: 1.6;
        }

        /* 动画 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

        /* 响应式与壳子覆盖 */
        body.has-app-shell .container { width: min(100%, 1100px); max-width: none; padding: 2rem 2.5rem 6rem; }
        body.has-app-shell .header { margin-bottom: 24px; }
        body.has-app-shell .header h1 { font-family: var(--font-display); font-size: 2.2rem; }

        @media (max-width: 768px) {
            .auth-bar, .filter-bar { flex-direction: column; align-items: stretch; }
            .auth-bar input, .filter-group { min-width: 100%; }
            .task-header { flex-direction: column; }
            .task-status { align-self: flex-start; }
            body.has-app-shell .container { padding: 1.5rem 1.5rem 5rem; }
        }

    </style>

<script>
// ===================== 状态 =====================
const STORAGE_KEY_READ  = () => `vta_read_${getMasked()}`;
const STORAGE_KEY_ALIAS = () => `vta_webhook_alias_${getMasked()}`;
let pageSizeChoice = '20';
try { pageSizeChoice = localStorage.getItem('vta_history_page_size') || '20'; } catch (_) {}
if (!['20', '50', '100', 'all'].includes(pageSizeChoice)) pageSizeChoice = '20';
let PAGE_SIZE = pageSizeChoice === 'all' ? 1000 : Number(pageSizeChoice);
const HISTORY_CACHE_TTL = 60000;
const HISTORY_FILTER_TTL = 300000;
let cacheOwner = '';
let filtersPromise = null;
let filtersLoadedAt = 0;
let historyRequest = 0;
let historyController = null;
let locationRestored = false;
let restoreScroll = null;
let displayedItems = [];
let selectedQuery = '';
let activePreview = null;
let previewController = null;
const previewCache = new Map();
const responseCache = new Map();

let currentPage = 0;
let totalItems  = 0;
let currentApiKey = '';
let currentMasked = '';
let filterOptions = { webhooks: [], platforms: [], platform_counts: [], authors: [] };
let historyFilterOptionsLoaded = false;
let selectedSet = new Set();   // 当前选中的 view_token

// ===================== 工具函数 =====================
function getMasked() { return currentMasked || 'anon'; }

function getReadSet() {
    try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY_READ()) || '[]')); }
    catch { return new Set(); }
}
function saveReadSet(s) {
    localStorage.setItem(STORAGE_KEY_READ(), JSON.stringify([...s]));
}
function markRead(viewToken) {
    const s = getReadSet(); s.add(viewToken); saveReadSet(s);
}
function markAllRead() {
    const rows = document.querySelectorAll('.task-row[data-vt]');
    const s = getReadSet();
    rows.forEach(r => s.add(r.dataset.vt));
    saveReadSet(s);
    renderReadState();
    applyReadFilter();
}

// ===================== 多选 =====================
function toggleSelect(vt, chkEl, rowEl) {
    if (selectedSet.has(vt)) {
        selectedSet.delete(vt);
        chkEl.checked = false;
        rowEl.classList.remove('selected');
    } else {
        selectedSet.add(vt);
        chkEl.checked = true;
        rowEl.classList.add('selected');
    }
    updateSelectionUI();
}

function toggleSelectAll(checked) {
    const rows = document.querySelectorAll('.task-row[data-vt]');
    rows.forEach(row => {
        const vt = row.dataset.vt;
        const chk = row.querySelector('.row-checkbox');
        if (checked) {
            selectedSet.add(vt);
            if (chk) chk.checked = true;
            row.classList.add('selected');
        } else {
            selectedSet.delete(vt);
            if (chk) chk.checked = false;
            row.classList.remove('selected');
        }
    });
    updateSelectionUI();
}

function clearSelection() {
    selectedSet.clear();
    document.querySelectorAll('.task-row.selected').forEach(row => row.classList.remove('selected'));
    document.querySelectorAll('.history-row-checkbox').forEach(check => { check.checked = false; });
    updateSelectionUI();
}

function updateSelectionUI() {
    const count = selectedSet.size;
    const countEl = document.getElementById('selectedCount');
    const action = document.getElementById('markSelectedBtn');
    countEl.style.display = count ? '' : 'none';
    countEl.textContent = `已选 ${count} 条（仅本页）`;
    action.style.display = count ? '' : 'none';
    action.textContent = `标为已打开 (${count})`;
    document.getElementById('clearSelectionBtn').hidden = !count;
    document.querySelector('.history-bulk-actions')?.classList.toggle('has-selection', count > 0);
    const rows = document.querySelectorAll('.task-row[data-vt]');
    const all = document.getElementById('selectAllChk');
    all.checked = count > 0 && count === rows.length;
    all.indeterminate = count > 0 && count < rows.length;
    all.disabled = rows.length === 0;
}

function markSelectedRead() {
    const s = getReadSet();
    selectedSet.forEach(vt => s.add(vt));
    saveReadSet(s);
    selectedSet.clear();
    document.querySelectorAll('.task-row.selected').forEach(row => {
        row.classList.remove('selected');
        const chk = row.querySelector('.row-checkbox');
        if (chk) chk.checked = false;
    });
    updateSelectionUI();
    renderReadState();
    applyReadFilter();
}

// ===================== 已读过滤（触发重新拉取+客户端过滤） =====================
function applyReadFilter() {
    serializeFiltersToURL();
    loadHistory(0);
}

// ===================== 过滤偏好持久化 =====================
// ===================== URL 参数过滤状态 =====================
// 所有过滤条件存在 URL 里，刷新/分享均保留；API Key 不入 URL（安全）

function serializeFiltersToURL(resetPage = true) {
    if (resetPage) currentPage = 0;
    const params = new URLSearchParams();
    const get = id => document.getElementById(id)?.value.trim() || '';

    const q         = get('filterQ');
    const startDate = get('filterStartDate');
    const endDate   = get('filterEndDate');
    const webhook   = get('filterWebhook');
    const platform  = get('filterPlatform');
    const author    = get('filterAuthor');
    const status    = get('filterStatus');
    const read      = get('filterRead');
    const marked    = get('filterMarked');
    const recordType = get('filterRecordType');
    const contentType = window.__historyContentType || 'all';

    if (q)         params.set('q', q);
    if (recordType && recordType !== 'task') params.set('record_type', recordType);
    if (startDate) params.set('start_date', startDate);
    if (endDate)   params.set('end_date', endDate);
    // webhook 含密钥，不写入 URL
    if (platform)  params.set('platform', platform);
    if (contentType !== 'all') params.set('content_type', contentType);
    if (author)    params.set('author', author);
    // 默认值不写入 URL，保持简洁
    const defaultStatus = 'all';
    if (status && status !== defaultStatus) params.set('status', status);
    if (read   && read   !== 'all')     params.set('read', read);
    if (marked && marked !== 'all')     params.set('marked', '1');

    if (currentPage > 0) params.set('page', String(currentPage + 1));
    if (pageSizeChoice !== '20') params.set('per_page', pageSizeChoice);
    const qs = params.toString();
    history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
}

function loadFiltersFromURL() {
    // 必须在 populateFilterDropdowns() 之后调用，webhook 选项才存在
    const params = new URLSearchParams(window.location.search);
    const set = (id, key) => {
        const val = params.get(key);
        if (val !== null) { const el = document.getElementById(id); if (el) el.value = val; }
    };
    set('filterQ',          'q');
    set('filterRecordType', 'record_type');
    set('filterStartDate',  'start_date');
    set('filterEndDate',    'end_date');
    // webhook 不从 URL 读取
    set('filterPlatform',   'platform');
    window.__historyContentType = ['video', 'post', 'file'].includes(params.get('content_type'))
        ? params.get('content_type')
        : 'all';
    // 频道多选：从 URL 恢复选中状态
    const authorParam = params.get('author');
    if (authorParam) {
        const selected = new Set(authorParam.split(',').map(s => s.trim()));
        document.querySelectorAll('#authorOptions input[type=checkbox]').forEach(chk => {
            chk.checked = selected.has(chk.value);
        });
        document.getElementById('filterAuthor').value = authorParam;
        updateAuthorDisplay();
    }
    updateRecordTypeFilterUI();
    set('filterStatus',     'status');
    set('filterRead',       'read');
    const markedParam = params.get('marked');
    if (markedParam === '1' || markedParam === 'true') {
        const el = document.getElementById('filterMarked');
        if (el) el.value = 'marked';
    }
    updateRecordTypeFilterUI(!params.has('status'));
    updateContentTypeChips();
    updatePlatformChips();
    syncDateRangePreset();
}

function updateRecordTypeFilterUI(normalizeStatus = true) {
    const type = document.getElementById('filterRecordType')?.value || 'task';
    const isReview = type !== 'task';
    const statusFilter = document.getElementById('historyStatusFilter');
    const statusHost = document.getElementById(isReview ? 'filterBar' : 'historyContentFilters');
    if (statusFilter && statusHost && statusFilter.parentElement !== statusHost) statusHost.appendChild(statusFilter);
    document.querySelectorAll('.history-task-filters').forEach(el => {
        el.hidden = isReview || !historyFilterOptionsLoaded;
    });

function localDateString(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function syncDateRangePreset() {
    const preset = document.getElementById('historyDateRange');
    const start = document.getElementById('filterStartDate')?.value || '';
    const end = document.getElementById('filterEndDate')?.value || '';
    if (!preset) return;
    if (!start && !end) { preset.value = 'all'; return; }
    const todayText = localDateString(new Date());
    const exactPreset = [7, 30, 90].find(days => {
        const first = new Date();
        first.setDate(first.getDate() - (days - 1));
        return start === localDateString(first) && end === todayText;
    });
    preset.value = exactPreset ? String(exactPreset) : 'custom';
}

function applyDateRangePreset(value) {
    const moreFilters = document.querySelector('.history-more-filters');
    if (value === 'custom') {
        if (moreFilters) moreFilters.open = true;
        document.getElementById('filterStartDate')?.focus();
        return;
    }
    const startInput = document.getElementById('filterStartDate');
    const endInput = document.getElementById('filterEndDate');
    if (!startInput || !endInput) return;
    if (value === 'all') {
        startInput.value = '';
        endInput.value = '';
    } else {
        const days = Number(value);
        const today = new Date();
        const first = new Date(today);
        first.setDate(first.getDate() - (days - 1));
        startInput.value = localDateString(first);
        endInput.value = localDateString(today);
    }
    currentPage = 0;
    serializeFiltersToURL();
    loadHistory(0);
}

function cacheKey(key) { return `vta_history_v2:${cacheOwner}:${key}`; }

    let entry = responseCache.get(key);
    if (!entry) { try { entry = JSON.parse(sessionStorage.getItem(cacheKey(key)) || 'null'); } catch (_) {} }

    return entry.data;

function writeHistoryCache(key, data) {
    const safeData = { ...data };
    if (Array.isArray(safeData.items)) safeData.items = safeData.items.map(({ wechat_webhook, ...item }) => item);
    if (Array.isArray(safeData.webhooks)) safeData.webhooks = [];
    const entry = { time: Date.now(), data: safeData };
    responseCache.set(key, entry);
    while (responseCache.size > 10) responseCache.delete(responseCache.keys().next().value);
    try {
        let keys = JSON.parse(sessionStorage.getItem(cacheKey('keys')) || '[]').filter(value => value !== key);
        keys.push(key);
        while (keys.length > 10) sessionStorage.removeItem(cacheKey(keys.shift()));
        sessionStorage.setItem(cacheKey(key), JSON.stringify(entry));
        sessionStorage.setItem(cacheKey('keys'), JSON.stringify(keys));
    } catch (_) { /* A full or unavailable storage must not block the list. */ }
}

async function loadHistory(page = null, options = {}) {
    if (!window.LearnFluxAuth) { showStatus('err', '认证组件加载失败，请刷新页面'); return; }
    try {
        await window.LearnFluxAuth.ready;
        if (!window.LearnFluxAuth.isAuthenticated()) {
            await window.LearnFluxAuth.requireSession({ title: '连接后查看历史记录', reason: '输入管理口令后继续当前查询；筛选条件和搜索词会保留。' });
        }
    } catch (error) { showStatus('err', error.message || '未能建立浏览器会话'); return; }
    const auth = window.LearnFluxAuth.getState();
    const owner = `${auth.user?.user_id || ''}:${auth.expires_at || ''}`;
    if (cacheOwner !== owner) { cacheOwner = owner; responseCache.clear(); previewCache.clear(); filtersLoadedAt = 0; }
    document.getElementById('history-auth-gate').hidden = true;
    currentApiKey = window.LearnFluxAuth.getTokenPlaceholder();
    restoreHistoryLocation();
    if (page !== null) currentPage = Math.max(0, Number(page) || 0);
    historyFilterOptionsLoaded = true;
    document.getElementById('filterBar').style.display = 'flex';
    document.getElementById('statsBar').style.display = 'flex';
    updateRecordTypeFilterUI(false);
    updateFilterSummary();
    serializeFiltersToURL(false);
    // 复盘历史不依赖任务审计的筛选元数据。Metadata never gates record loading.
    if ((document.getElementById('filterRecordType')?.value || 'task') === 'task') void loadFilterOptions(options.force);
    await fetchHistory(options);
}

async function refreshHistory() { await loadHistory(currentPage, { force: true }); }

async function loadFilterOptions(force = false) {
    if (filtersPromise) return filtersPromise;
    if (!force && Date.now() - filtersLoadedAt < HISTORY_FILTER_TTL) return;
    const owner = cacheOwner;
    const apply = data => {
        if (owner !== cacheOwner || !window.LearnFluxAuth.isAuthenticated()) return;
        filterOptions = data;
        historyFilterOptionsLoaded = true;
        currentMasked = data.api_key_masked || currentMasked;
        populateFilterDropdowns();
        loadFiltersFromURL();
        updateRecordTypeFilterUI(false);
        updateFilterSummary();
        document.getElementById('filterBar').style.display = 'flex';
    };
    const cached = !force && readHistoryCache('filters', HISTORY_FILTER_TTL);
    if (cached) { apply(cached); filtersLoadedAt = Date.now(); return; }
    filtersPromise = apiFetch('/api/audit/filter-options').then(res => {
        if (res.code !== 200) throw new Error(res.message || '筛选项暂时不可用');
        if (owner !== cacheOwner || !window.LearnFluxAuth.isAuthenticated()) return;
        apply(res.data);
        filtersLoadedAt = Date.now();
        writeHistoryCache('filters', res.data);
    }).catch(error => {
        if (owner !== cacheOwner) return;
        console.warn('History filter metadata unavailable:', error.message);
        showStatus('err', '筛选选项暂时未更新，仍可搜索和浏览记录。');
    }).finally(() => { if (owner === cacheOwner) filtersPromise = null; });
    return filtersPromise;
}

function scrollTendedero(direction) {
    const track = document.getElementById('tendederoTrack');
    const card = track?.querySelector('.tendedero-card');
    if (!track || !card) return;
    const gap = parseFloat(getComputedStyle(track).columnGap) || 16;
    track.scrollBy({ left: direction * (card.getBoundingClientRect().width + gap), behavior: 'smooth' });
}

function updateTendederoPosition() {
    const track = document.getElementById('tendederoTrack');
    const position = document.getElementById('tendederoPosition');
    if (!track || !position) return;
    const cards = [...track.querySelectorAll('.tendedero-card')];
    const previous = document.querySelector('.tendedero-arrow:not(.is-next)');
    const next = document.querySelector('.tendedero-arrow.is-next');
    if (previous) previous.disabled = !cards.length || track.scrollLeft <= 1;
    if (next) next.disabled = !cards.length || track.scrollLeft + track.clientWidth >= track.scrollWidth - 1;
    if (!cards.length) { position.textContent = '0 / 0'; return; }
    const first = cards[0].getBoundingClientRect();
    const cardStep = first.width + (parseFloat(getComputedStyle(track).columnGap) || 16);
    const index = Math.min(cards.length, Math.max(1, Math.round(track.scrollLeft / cardStep) + 1));
    position.textContent = `${index} / ${cards.length}`;
}

function layoutTendederoRope() {
    const track = document.getElementById('tendederoTrack');
    if (!track) return;
    const cards = [...track.querySelectorAll('.tendedero-card')];
    const rope = track.querySelector('.tendedero-rope');
    if (!cards.length || !rope) return;
    const width = Math.max(track.scrollWidth, track.clientWidth);
    const span = Math.max(1, track.clientWidth);
    rope.setAttribute('viewBox', `0 0 ${width} 64`);
    rope.setAttribute('width', String(width));
    const segments = [];
    for (let start = 0; start < width; start += span) segments.push(`M ${start} 18 C ${start + span / 3} 50 ${start + span * 2 / 3} 50 ${start + span} 18`);
    rope.querySelector('path').setAttribute('d', segments.join(' '));
    cards.forEach(card => {
        const center = card.offsetLeft + card.offsetWidth / 2;
        const t = Math.max(0, Math.min(1, (center % span) / span));
        const drop = 24 * 4 * t * (1 - t);
        card.style.setProperty('--hanger-drop', `${drop.toFixed(1)}px`);
    });
}

    // This render-local map is shared by recent cards and rows; it never changes stored records.
    const assignments = new Map();
    items.forEach((item, index) => {
        const identity = historyCoverIdentity(item);
        if (!assignments.has(identity)) assignments.set(identity, HISTORY_COVERS[index % HISTORY_COVERS.length]);

        cover = HISTORY_COVERS[(hash >>> 0) % HISTORY_COVERS.length];

}

// ===================== API 请求 =====================
async function apiFetch(url, params = {}, options = {}) {
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(qs ? `${url}?${qs}` : url, {
        headers: { 'Authorization': `Bearer ${currentApiKey}` }, signal: options.signal
    });
    const json = await res.json();
    if (res.status === 401) { showStatus('err', '会话已过期，请重新连接'); throw new Error('401'); }
    if (!res.ok) throw new Error(typeof json.detail === 'string' ? json.detail : json.message || '查询失败');
    return json;
}

let _filteredItems = null;
function historyQueryParams() {
    const params = { limit: PAGE_SIZE, offset: currentPage * PAGE_SIZE };
    const fields = { filterStartDate: 'start_date', filterEndDate: 'end_date', filterPlatform: 'platform', filterAuthor: 'author', filterStatus: 'status', filterQ: 'q' };
    for (const [id, key] of Object.entries(fields)) {
        const value = document.getElementById(id)?.value.trim() || (key === 'platform' ? new URLSearchParams(location.search).get('platform') : '') || '';
        if (value) params[key] = value;
    }
    if (document.getElementById('filterMarked')?.value === 'marked') params.marked = 'true';
    if (window.__historyContentType && window.__historyContentType !== 'all') params.content_type = window.__historyContentType;
    return params;
}
function setHistoryBusy(busy, message = '') {
    document.getElementById('listArea').setAttribute('aria-busy', String(busy));
    document.getElementById('historyQueryState').textContent = message;
}
function applyHistoryData(data, readFilter) {
    currentMasked = data.api_key_masked || currentMasked;
    const readSet = getReadSet();
    const items = data.items || [];
    if (readFilter !== 'all') {
        _filteredItems = items.filter(item => {
            const opened = Boolean(item.view_token && readSet.has(item.view_token));
            return readFilter === 'read' ? opened : !opened;
        });
        totalItems = _filteredItems.length;
    } else { _filteredItems = null; totalItems = Number(data.total) || 0; }
    const limited = pageSizeChoice === 'all' && totalItems > 1000;
    if (limited) {
        pageSizeChoice = '100'; PAGE_SIZE = 100; currentPage = 0;
        document.getElementById('historyPageSize').value = '100';
        try { localStorage.setItem('vta_history_page_size', '100'); } catch (_) {}
        serializeFiltersToURL(false);
    }
    currentPage = Math.min(currentPage, Math.max(0, Math.ceil(totalItems / PAGE_SIZE) - 1));
    const visible = _filteredItems ? _filteredItems.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE) : items.slice(0, PAGE_SIZE);
    const query = JSON.stringify({ ...historyQueryParams(), read: readFilter });
    if (selectedQuery !== query) clearSelection();
    selectedQuery = query;
    renderList(visible);
    renderPagination();
    updateUnreadBadge(visible);
    if (restoreScroll !== null) {
        const top = restoreScroll; restoreScroll = null;
        requestAnimationFrame(() => { const root = historyScrollRoot(); if (root) root.scrollTop = top; else window.scrollTo(0, top); });
    }
    return limited;
}

async function fetchHistory(options = {}) {
    const request = ++historyRequest;
    historyController?.abort();
    historyController = new AbortController();
    const signal = historyController.signal;
    closeSummary();
    const recordType = document.getElementById('filterRecordType')?.value || 'task';
    if (recordType !== 'task') return fetchReviewHistory(recordType, { request, signal, ...options });
    const readFilter = document.getElementById('filterRead')?.value || 'all';
    const params = historyQueryParams();
    if (readFilter !== 'all') { params.limit = 500; params.offset = 0; }
    const key = 'records:' + new URLSearchParams(params).toString() + ':read=' + readFilter;
    const cached = !options.force && readHistoryCache(key, HISTORY_CACHE_TTL);
    if (cached) {
        const limited = applyHistoryData(cached, readFilter);
        setHistoryBusy(false, limited ? '结果超过 1000 条，已切换为每页 100 条。' : '已显示最近读取的记录');
        if (options.scrollToList) document.getElementById('statsBar').scrollIntoView({ block: 'start' });
        return;
    }
    showListLoading();
    setHistoryBusy(true, displayedItems.length ? '正在更新记录…' : '正在读取历史记录…');
    try {
        let res = await apiFetch('/api/audit/history', params, { signal });
        if (request !== historyRequest) return;
        if (res.code !== 200) throw new Error(res.message || '查询失败');
        const data = { ...res.data, items: [...(res.data.items || [])] };
        // Browser-local opened state: scan bounded pages, without silently truncating to 10,000.
        while (readFilter !== 'all' && data.items.length < data.total) {
            const offset = data.items.length;
            setHistoryBusy(true, `正在筛选打开记录… ${offset} / ${data.total}`);
            const next = await apiFetch('/api/audit/history', { ...params, offset }, { signal });
            if (request !== historyRequest) return;
            if (next.code !== 200) throw new Error(next.message || '查询失败');
            if (!next.data?.items?.length) throw new Error('记录发生变化，请刷新后重新筛选');
            data.items.push(...next.data.items);
        }
        if (request !== historyRequest) return;
        if (currentPage > 0 && params.offset >= data.total && readFilter === 'all') {
            currentPage = Math.max(0, Math.ceil(data.total / PAGE_SIZE) - 1);
            serializeFiltersToURL(false);
            return fetchHistory(options);
        }
        writeHistoryCache(key, data);
        const limited = applyHistoryData(data, readFilter);
        setHistoryBusy(false, limited ? '结果超过 1000 条，已切换为每页 100 条。' : readFilter === 'all' ? '记录已更新' : '按当前浏览器的打开记录筛选');
        if (options.scrollToList) document.getElementById('statsBar').scrollIntoView({ block: 'start' });
    } catch (error) {
        if (error.name === 'AbortError' || request !== historyRequest) return;
        if (error.message === '401') {
            displayedItems = []; responseCache.clear();
            document.getElementById('listArea').replaceChildren();
        }
        showError(error.message === '401' ? '会话已过期，请重新连接后重试。' : '记录暂时无法更新，请重试。');
    } finally {
        if (request === historyRequest) document.getElementById('listArea').setAttribute('aria-busy', 'false');
    }
}

async function fetchReviewHistory(recordType, options = {}) {
    const params = {limit: 200};
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;
    const status = document.getElementById('filterStatus').value;
    const keyword = document.getElementById('filterQ')?.value.trim() || '';
    if (recordType !== 'review_all') params.record_type = recordType;
    if (startDate) params.start_date = startDate;
    if (endDate) params.end_date = endDate;
    if (status && status !== 'all') params.status = status;
    if (keyword) params.keyword = keyword;
    try {
        setHistoryBusy(true, '正在读取复盘记录…');
        const res = await apiFetch('/api/reviews/search', params, { signal: options.signal });
        if (options.request !== historyRequest) return;
        if (res.code !== 200) { showError(res.message || '复盘记录查询失败'); return; }
        _filteredItems = res.data.items || [];
        totalItems = _filteredItems.length;
        const pageItems = _filteredItems.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
        renderReviewList(pageItems);
        renderPagination();
        document.getElementById('totalCount').textContent = `共 ${totalItems} 条复盘记录`;
        document.getElementById('unreadBadge').style.display = 'none';
        setHistoryBusy(false, '复盘记录已更新');
    } catch (e) {
        if (e.name === 'AbortError' || options.request !== historyRequest) return;
        if (e.message === '401') showError('访问令牌无效或已过期');
        else showError('复盘记录查询失败，请稍后重试');
    }
}

function renderList(items) {

        area.innerHTML = filtered

function buildRow(item, readSet, index) {
    const isCompleted = item.status === 'success';
    const canOpen = Boolean(item.view_token);
    const isRead = isCompleted && readSet.has(item.view_token);
    const title = historyItemTitle(item);
    const rawTime = item.request_time_display || item.request_time;
    const date = rawTime ? String(rawTime).replace('T', ' ').slice(0, 10) : '—';

        ? `<input type="checkbox" class="row-checkbox history-row-checkbox" aria-label="选择记录：${esc(title)}" ${selected ? 'checked' : ''}>`
        : '<span class="history-row-checkbox-placeholder" aria-hidden="true"></span>';
    const href = canOpen ? `/view/${encodeURIComponent(item.view_token)}` : '';
    const titleMarkup = canOpen
        ? `<a class="history-row-title" href="${href}" data-open-view="${esc(item.view_token)}" target="_blank" rel="noopener">${esc(title)}</a>`
        : `<div class="history-row-title">${esc(title)}</div>`;
    const actionLabel = isCompleted ? '打开' : item.status === 'failed' ? '查看原因' : item.status === 'awaiting_cloud_confirmation' ? '确认费用' : ['canceled', 'cancelled', 'unknown'].includes(item.status) ? '查看详情' : '查看进度';
    const action = canOpen
        ? `<a class="history-open-link" href="${href}" data-open-view="${esc(item.view_token)}" target="_blank" rel="noopener">${actionLabel}</a>`
        : `<button type="button" class="history-preview-button" data-record-details aria-expanded="false" aria-controls="history-summary-${index}">查看记录</button>`;
    const preview = isCompleted && canOpen
        ? `<button type="button" class="history-preview-button" data-preview-view="${esc(item.view_token)}" aria-expanded="false" aria-controls="history-summary-${index}">摘要</button>` : '';
    const excerpt = summaryPlainText(item.excerpt || item.description || item.summary || item.author || item.video_url || '');
    return `<div class="task-row task-card history-record-row ${isCompleted ? isRead ? 'read' : 'unread' : ''} ${selected ? 'selected' : ''}" ${isCompleted && canOpen ? `data-vt="${esc(item.view_token)}"` : ''}>
        <div class="history-row-content">${check}<span class="history-row-cover" aria-hidden="true" style="background-image:url('${historyCoverURL(item)}')"></span><div class="history-row-copy"><div class="history-row-title-line">${titleMarkup}${item.is_marked ? '<span class="mark-badge">精华</span>' : ''}</div>${excerpt ? `<div class="history-row-author">${esc(excerpt)}</div>` : ''}</div></div>
        <div class="history-row-platform">${platformBadgeHTML(item.platform)}</div>
        <time class="history-row-date" ${date !== '—' ? `datetime="${esc(date)}"` : ''}>${esc(date)}</time>
        <div class="history-row-status"><span class="history-status ${statusClass}"><span class="history-status-dot" aria-hidden="true"></span>${statusLabel}</span></div>
        <div class="history-row-action">${action}${preview}</div>
        ${item.error ? `<div class="history-row-error">${esc(item.error)}</div>` : ''}
        ${preview ? `<div id="history-summary-${index}" class="history-row-summary" aria-live="polite" hidden></div>` : !canOpen ? `<div id="history-summary-${index}" class="history-row-summary" hidden>这条记录保留了导入信息，目前没有可打开的处理结果。\n任务编号：${esc(item.task_id || '未记录')}\n原链接：${esc(item.video_url || '未记录')}</div>` : ''}
    </div>`;
}

function renderReadState() {
    const readSet = getReadSet();
    document.querySelectorAll('.task-row[data-vt]').forEach(row => {
        const vt = row.dataset.vt;
        if (readSet.has(vt)) {
            row.classList.add('read');
            row.classList.remove('unread');
        }
    });
    updateUnreadBadgeFromDOM();
}

function updateUnreadBadge(items) {
    const readSet = getReadSet();
    const unread = items.filter(i => i.view_token && !readSet.has(i.view_token) && i.status === 'success').length;
    const badge = document.getElementById('unreadBadge');
    const total = document.getElementById('totalCount');
    total.textContent = `(${totalItems})`;
    if (unread > 0) {
        badge.style.display = '';
        badge.textContent = `本页 ${unread} 条未打开`;
    } else {
        badge.style.display = 'none';
    }
}

function updateUnreadBadgeFromDOM() {
    const readSet = getReadSet();
    const rows = document.querySelectorAll('.task-row[data-vt]');
    let unread = 0;
    rows.forEach(r => { if (!readSet.has(r.dataset.vt)) unread++; });
    const badge = document.getElementById('unreadBadge');
    badge.style.display = unread > 0 ? '' : 'none';
    badge.textContent = `本页 ${unread} 条未打开`;
}

function renderPagination() {
    const bar = document.getElementById('paginationBar');
    const pages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
    bar.style.display = 'flex';
    document.getElementById('pageInfo').textContent = `/ ${pages} 页`;
    document.getElementById('pageRange').textContent = totalItems ? `${currentPage * PAGE_SIZE + 1}–${Math.min(totalItems, (currentPage + 1) * PAGE_SIZE)} / ${totalItems} 条` : '共 0 条';
    const jump = document.getElementById('pageJump');
    jump.value = currentPage + 1; jump.max = pages;
    jump.disabled = pages <= 1;
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage >= pages - 1;
    const size = document.getElementById('historyPageSize');
    size.value = pageSizeChoice;
    const all = size.querySelector('[value="all"]');
    if (all) { all.disabled = totalItems > 1000; all.textContent = totalItems <= 1000 ? `全部（${totalItems} 条）` : '全部（最多 1000 条）'; }
}

function openTask(viewToken, rowEl) {
    if (rowEl) { markRead(viewToken); rowEl.classList.add('read'); updateUnreadBadgeFromDOM(); }
    saveHistoryPosition();
    window.open(`/view/${encodeURIComponent(viewToken)}`, '_blank', 'noopener');
}

function closeSummary() {
    previewController?.abort();
    if (activePreview) {
        activePreview.panel.hidden = true;
        activePreview.button.setAttribute('aria-expanded', 'false');
        activePreview.button.textContent = '摘要';
    }
    activePreview = null;
}
function summaryPlainText(value) {
    return String(value || '').replace(/^#{1,6}\s+/gm, '').replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1').trim();
}
async function toggleSummary(viewToken, row, button) {
    if (activePreview?.button === button) { closeSummary(); return; }
    closeSummary();
    const panel = row.querySelector('.history-row-summary');
    const target = { panel, button };
    activePreview = target;
    panel.hidden = false;
    button.setAttribute('aria-expanded', 'true'); button.textContent = '收起摘要';
    panel.textContent = '正在读取摘要…';
    previewController = new AbortController();
    const signal = previewController.signal;
    try {
        let summary = previewCache.get(viewToken);
        if (summary === undefined) {
            const res = await apiFetch('/api/audit/summary', { view_token: viewToken }, { signal });
            if (res.code !== 200) throw new Error(res.message || '摘要暂时不可用');
            summary = summaryPlainText(res.data.summary) || '暂无摘要，可以打开原文继续阅读。';
            previewCache.set(viewToken, summary);
        }
        if (signal.aborted || activePreview !== target || !row.isConnected) return;
        panel.textContent = summary;
    } catch (error) {
        if (error.name === 'AbortError' || activePreview !== target) return;
        panel.textContent = '摘要暂时无法读取，请收起后重试，或直接打开内容。';
    }
}

// ===================== Webhook 别名 =====================
function toggleAliasPanel() {
    const panel = document.getElementById('aliasPanel');
    panel.classList.toggle('visible');
    if (panel.classList.contains('visible')) buildAliasRows();
}

function buildAliasRows() {
    const aliasMap = getAliasMap();
    const container = document.getElementById('aliasRows');
    container.innerHTML = filterOptions.webhooks.map(w => `
        <div class="alias-row">
            <span class="alias-url" title="${esc(w)}">${esc(w)}</span>
            <input class="alias-input" type="text" placeholder="设置别名..." aria-label="Webhook 别名"
                   data-url="${esc(w)}"
                   value="${esc(aliasMap[w] || '')}">
        </div>
    `).join('');
}

function saveAliases() {
    const inputs = document.querySelectorAll('.alias-input');
    const map = {};
    inputs.forEach(inp => {
        const url = inp.dataset.url;
        const alias = inp.value.trim();
        if (alias) map[url] = alias;
    });
    saveAliasMap(map);
    populateFilterDropdowns();
    showStatus('ok', '别名已保存');
}

// ===================== UI 辅助 =====================
function showListLoading() {
    if (displayedItems.length || document.querySelector('#listArea .task-list')) return;
    document.getElementById('listArea').innerHTML = `<div class="state-box"><div>正在读取历史记录…</div><p>首次读取可能需要几秒，返回时会保留近期结果。</p></div>`;
}
function showError(message) {
    setHistoryBusy(false, message);
    if (displayedItems.length) {
        showStatus('err', '暂时无法更新，已保留当前记录。点击刷新记录重试。');
        return;
    }
    document.getElementById('listArea').innerHTML = `<div class="state-box"><div>${esc(message)}</div><button class="btn btn-ghost" onclick="refreshHistory()">重试</button></div>`;
}

function showStatus(type, msg) {
    const el = document.getElementById('authStatus');
    el.style.display = '';
    el.className = `auth-status ${type}`;
    el.textContent = msg;
}
function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 过滤栏任意子元素 change → 实时写入 URL（冒泡监听，无需逐一绑定）
document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') { const opener = activePreview?.button; closeSummary(); opener?.focus(); }
    });
    window.addEventListener('pagehide', saveHistoryPosition);
    window.addEventListener('learnflux:authchange', event => {
        const nextOwner = `${event.detail?.user?.user_id || ''}:${event.detail?.expires_at || ''}`;
        if (event.detail?.authenticated && (!cacheOwner || nextOwner === cacheOwner)) return;
        historyRequest += 1;
        historyController?.abort(); closeSummary(); responseCache.clear(); previewCache.clear(); clearSelection();
        try {
            const keys = JSON.parse(sessionStorage.getItem(cacheKey('keys')) || '[]');
            keys.forEach(key => sessionStorage.removeItem(cacheKey(key)));
            sessionStorage.removeItem(cacheKey('keys'));
            sessionStorage.removeItem(historyStateKey());
        } catch (_) {}
        historyCoverAssignments.clear();
        cacheOwner = ''; filtersPromise = null; filtersLoadedAt = 0; currentMasked = ''; locationRestored = false;
        renderTendedero([], false);
        filterOptions = { webhooks: [], platforms: [], platform_counts: [], authors: [] };
        historyFilterOptionsLoaded = false;
        document.getElementById('platformChips').replaceChildren();
        document.getElementById('authorOptions').replaceChildren();
        document.getElementById('filterAuthor').value = '';
        document.getElementById('authorDisplay').textContent = '全部';
        document.getElementById('totalCount').textContent = '';
        document.getElementById('unreadBadge').textContent = '';
        document.getElementById('unreadBadge').style.display = 'none';
        document.getElementById('statsBar').style.display = 'none';
        document.getElementById('filterBar').style.display = 'none';
        document.querySelectorAll('.history-task-filters').forEach(element => { element.hidden = true; });
        const params = new URLSearchParams(location.search); params.delete('author');
        history.replaceState(null, '', params.size ? '?' + params.toString() : location.pathname);
        displayedItems = []; document.getElementById('listArea').replaceChildren();
        document.getElementById('paginationBar').style.display = 'none';
        if (event.detail?.authenticated) void loadHistory(0);
    });
    const bar = document.getElementById('filterBar');
    if (bar) bar.addEventListener('change', serializeFiltersToURL);
    ['filterStartDate', 'filterEndDate'].forEach(id => {
        const input = document.getElementById(id);
        if (!input) return;
        input.addEventListener('change', () => {
            syncDateRangePreset();
            currentPage = 0;
            serializeFiltersToURL();
            loadHistory(0);
        });
    });

    const platformChips = document.getElementById('platformChips');
    if (platformChips) platformChips.addEventListener('click', event => {
        const button = event.target.closest('.platform-chip');
        if (!button) return;
        document.getElementById('filterPlatform').value = button.dataset.platform || '';
        updatePlatformChips();
        currentPage = 0;
        serializeFiltersToURL();
        loadHistory(0);
    });

    const contentTypeChips = document.getElementById('contentTypeChips');
    if (contentTypeChips) contentTypeChips.addEventListener('click', event => {
        const button = event.target.closest('.type-chip');
        if (!button) return;
        window.__historyContentType = button.dataset.contentType || 'all';
        updateContentTypeChips();
        currentPage = 0;
        serializeFiltersToURL();
        loadHistory(0);
    });

    const tendedero = document.getElementById('tendederoTrack');
    if (tendedero) tendedero.addEventListener('scroll', updateTendederoPosition, { passive: true });
    window.addEventListener('resize', () => requestAnimationFrame(layoutTendederoRope), { passive: true });

    // 搜索框：回车立即搜索，输入 500ms 防抖自动搜索
    const qInput = document.getElementById('filterQ');
    if (!qInput) return;
    qInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { clearTimeout(searchDebounce); serializeFiltersToURL(); loadHistory(0); }
    });
    qInput.addEventListener('input', () => {
        historyRequest += 1; historyController?.abort(); closeSummary(); clearSelection();
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => { serializeFiltersToURL(); loadHistory(0); }, 500);
    });
});
let searchDebounce = null;

// ===================== 初始化 =====================
window.LearnFluxAuth.ready.then(function (authState) {
    if (authState.authenticated) {
        loadHistory();
        return;
    }
    const authGate = document.getElementById('history-auth-gate');
    authGate.hidden = false;
    window.LearnFluxAuth.renderAuthGate(authGate, {
        title: '连接后查看历史记录',
        reason: '输入管理口令后读取学习任务与复盘记录；当前筛选链接会保留。',
        onAuthenticated: () => loadHistory(0)
    });
});
</script>
