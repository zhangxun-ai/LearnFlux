<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
        <script>
        (function() {
            try {
                var theme = localStorage.getItem('vta_theme_preference');
                if (theme) {
                    var parsedTheme = theme;
                    try { parsedTheme = JSON.parse(theme); } catch(e) {}
                    document.documentElement.setAttribute('data-theme', parsedTheme);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch(e) {}
        })();
    </script>

    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root, [data-theme="light"], [data-theme="dark"] {
            --hist-accent: var(--accent-primary);
            --hist-accent-hover: var(--accent-hover);
            --hist-accent-soft: var(--accent-soft);
            --hist-card: var(--bg-primary);
            --hist-card-hover: var(--bg-secondary);
            --hist-border: var(--border-primary);
            --hist-shadow: var(--shadow-sm);
            --hist-shadow-hover: var(--shadow);
            --hist-radius: 12px;
            --hist-radius-lg: 16px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: var(--bg-secondary);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

        /* 顶部 Header */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        .header a {
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: auto;
            transition: color 0.2s;
            font-weight: 500;
        }
        .header a:hover { color: var(--hist-accent); }

        /* API Key / Webhook 输入区 (Toolbar blocks) */
        .auth-bar, .alias-panel, .filter-bar {
            background: var(--hist-card);
            border: 1px solid var(--hist-border);
            border-radius: var(--hist-radius-lg);
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: var(--hist-shadow);
        }
        
        .auth-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .auth-bar label { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
        .auth-bar input {
            flex: 1;
            min-width: 240px;
            background: var(--bg-secondary);
            border: 1px solid var(--hist-border);
            border-radius: var(--hist-radius);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: monospace;
            transition: all 0.2s;
        }
        .auth-bar input:focus { outline: none; border-color: var(--hist-accent); box-shadow: 0 0 0 3px var(--hist-accent-soft); }
        
        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            border-radius: var(--hist-radius);
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--hist-accent) 0%, #F56551 100%); 
            color: #fff; 
            box-shadow: 0 4px 12px rgba(228,80,58,0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(228,80,58,0.4); }
        .btn-primary:active { transform: scale(0.97); }
        
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1.5px solid var(--hist-border);
        }
        .btn-ghost:hover { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--text-tertiary); }
        
        .auth-status {
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 999px;
            white-space: nowrap;
            font-weight: 600;
        }
        .auth-status.ok { background: rgba(16, 185, 129, 0.1); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .auth-status.err { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .remember-label {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .remember-label input { width: 16px; height: 16px; accent-color: var(--hist-accent); cursor: pointer; }

        /* Webhook 别名设置 */
        .alias-panel { display: none; }
        .alias-panel.visible { display: block; animation: fadeIn 0.3s ease; }
        .alias-panel h3 { font-size: 1.05rem; color: var(--text-primary); font-weight: 600; margin-bottom: 16px; }
        .alias-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .alias-url {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--hist-border);
        }
        .alias-input {
            background: var(--bg-primary);
            border: 1.5px solid var(--hist-border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 220px;
            transition: all 0.2s;
        }
        .alias-input:focus { outline: none; border-color: var(--hist-accent); box-shadow: 0 0 0 3px var(--hist-accent-soft); }
        .alias-save-hint { font-size: 0.85rem; color: var(--text-tertiary); margin-top: 12px; }

        /* 过滤栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; min-width: 160px; }
        .filter-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        .filter-group select,
        .filter-group input[type="date"] {
            background: var(--bg-primary);
            border: 1.5px solid var(--hist-border);
            border-radius: var(--hist-radius);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .filter-group select:focus,
        .filter-group input[type="date"]:focus { outline: none; border-color: var(--hist-accent); box-shadow: 0 0 0 3px var(--hist-accent-soft); }
        .filter-group select option { background: var(--bg-primary); }
        .filter-actions { display: flex; gap: 12px; align-items: flex-end; margin-left: auto; }

        /* 频道多选下拉 */
        .multi-select {
            background: var(--bg-primary);
            border: 1.5px solid var(--hist-border);
            border-radius: var(--hist-radius);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            transition: all 0.2s;
        }
        .multi-select:hover { border-color: var(--hist-accent); }
        .multi-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 100;
            background: var(--hist-card);
            border: 1px solid var(--hist-border);
            border-radius: var(--hist-radius);
            max-height: 280px;
            overflow-y: auto;
            min-width: 200px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
            margin-top: 8px;
        }
        [data-theme="dark"] .multi-dropdown { box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
        .multi-opt {
            padding: 10px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            transition: background 0.15s;
        }
        .multi-opt:hover { background: var(--hist-accent-soft); }
        .multi-opt input { width: 16px; height: 16px; accent-color: var(--hist-accent); cursor: pointer; }

        /* 统计条 */
        .stats-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .unread-badge {
            background: var(--hist-accent);
            color: #fff;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* 任务列表 */
        .task-list { display: flex; flex-direction: column; gap: 16px; }
        .task-card {
            background: var(--hist-card);
            border: 1px solid var(--hist-border);
            border-radius: var(--hist-radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: var(--hist-shadow);
            position: relative;
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--hist-shadow-hover);
            border-color: rgba(228,80,58,0.2);
        }
        .task-card.unread { border-left: 4px solid var(--hist-accent); }
        .task-card.unread::after {
            content: '';
            position: absolute;
            top: 24px;
            right: 24px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--hist-accent);
        }
        .task-card.selected {
            border-color: var(--hist-accent);
            background: var(--hist-accent-soft);
        }
        .row-checkbox {
            width: 16px;
            height: 16px;
            accent-color: var(--hist-accent);
            cursor: pointer;
        }

        /* 卡片头部 */
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
        .task-meta { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
        .task-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-subtitle { font-size: 0.9rem; color: var(--text-secondary); display: flex; gap: 12px; flex-wrap: wrap; }
        .task-status {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            border: 1px solid transparent;
        }
        .status-completed { background: rgba(16, 185, 129, 0.1); color: #10B981; border-color: rgba(16, 185, 129, 0.2); }
        .status-failed { background: rgba(239, 68, 68, 0.1); color: #EF4444; border-color: rgba(239, 68, 68, 0.2); }
        .status-processing { background: rgba(245, 158, 11, 0.1); color: #F59E0B; border-color: rgba(245, 158, 11, 0.2); }

        /* 卡片内容区 */
        .task-body { display: flex; flex-direction: column; gap: 16px; }
        .task-url {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            background: var(--bg-secondary);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--hist-border);
            word-break: break-all;
        }
        .task-url a { color: var(--hist-accent); text-decoration: none; font-weight: 500; }
        .task-url a:hover { text-decoration: underline; }
        
        .task-error {
            background: rgba(239, 68, 68, 0.05);
            border-left: 3px solid #EF4444;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #EF4444;
        }

        /* 标签 */
        .tag-list { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag {
            background: var(--bg-secondary);
            border: 1px solid var(--hist-border);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* Webhook 投递结果 */
        .webhook-results { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .wh-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--hist-border);
        }
        .wh-status {
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .wh-status.ok { background: rgba(16, 185, 129, 0.1); color: #10B981; }
        .wh-status.err { background: rgba(239, 68, 68, 0.1); color: #EF4444; }
        .wh-alias { font-weight: 600; color: var(--text-primary); }
        .wh-detail { color: var(--text-tertiary); font-family: monospace; }

        /* 摘要预览卡片 */
        .summary-tooltip {
            position: fixed;
            background: var(--hist-card);
            border: 1px solid var(--hist-border);
            border-radius: var(--hist-radius);
            padding: 14px 16px;
            width: 340px;
            max-height: 240px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-secondary);
            z-index: 1000;
            box-shadow: var(--hist-shadow-hover);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
        }
        .summary-tooltip.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .summary-tooltip-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        /* 卡片底部动作 */
        .task-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--hist-border);
        }

        /* 空状态与加载 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-tertiary);
            background: var(--hist-card);
            border: 1px dashed var(--hist-border);
            border-radius: var(--hist-radius-lg);
            font-size: 1.05rem;
        }
        .loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 1.05rem; }
        .error-state { text-align: center; padding: 40px 20px; color: #EF4444; background: rgba(239, 68, 68, 0.05); border-radius: var(--hist-radius-lg); }

        /* 模态框 (JSON Viewer) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--hist-card);
            border-radius: var(--hist-radius-lg);
            width: 90%; max-width: 800px; max-height: 85vh;
            display: flex; flex-direction: column;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            transform: translateY(20px) scale(0.98);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--hist-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
        .modal-close {
            background: transparent; border: none; font-size: 1.5rem;
            cursor: pointer; color: var(--text-tertiary); padding: 4px; line-height: 1;
            transition: color 0.2s;
        }
        .modal-close:hover { color: var(--hist-accent); }
        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
            background: var(--bg-secondary);
        }
        .modal-body pre {
            white-space: pre-wrap; word-break: break-all;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.9rem; color: var(--text-primary);
            line-height: 1.6;
        }

        /* 动画 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

        /* 响应式与壳子覆盖 */
        body.has-app-shell .container { width: min(100%, 1100px); max-width: none; padding: 2rem 2.5rem 6rem; }
        body.has-app-shell .header { margin-bottom: 24px; }
        body.has-app-shell .header h1 { font-family: var(--font-display); font-size: 2.2rem; }

        @media (max-width: 768px) {
            .auth-bar, .filter-bar { flex-direction: column; align-items: stretch; }
            .auth-bar input, .filter-group { min-width: 100%; }
            .task-header { flex-direction: column; }
            .task-status { align-self: flex-start; }
            body.has-app-shell .container { padding: 1.5rem 1.5rem 5rem; }
        }

    </style>
</head>

<div class="container">
    <div class="header">
        <h1>任务历史</h1>
    </div>

    <!-- 访问令牌输入 -->
    <div class="auth-bar">
        <label>API 访问令牌</label>
        <input type="password" id="apiKeyInput" placeholder="输入访问令牌后查看任务记录" autocomplete="off">
        <button class="btn btn-primary" onclick="loadHistory()">查询</button>
        <span class="auth-status" id="authStatus" style="display:none"></span>
        <span style="flex:1"></span>
    </div>
    <div style="font-size:0.8rem; color:var(--text-tertiary); margin:-6px 0 4px;">
        即后台 <code>config.jsonc</code> 里的 <code>api.auth_token</code>（与提交任务、设置页用的是同一个令牌）；输入后会记在本浏览器，下次自动带入。
    </div>

    <!-- 过滤栏 -->
    <div class="filter-bar" id="filterBar" style="display:none">
        <div class="filter-group">
            <label>开始日期</label>
            <input type="date" id="filterStartDate">
        </div>
        <div class="filter-group">
            <label>结束日期</label>
            <input type="date" id="filterEndDate">
        </div>
        <div class="filter-group">
            <label>平台</label>
            <select id="filterPlatform">
                <option value="">全部</option>
            </select>
        </div>
        <div class="filter-group" style="position:relative">
            <label>频道</label>
            <div id="authorMultiSelect" class="multi-select" onclick="toggleAuthorDropdown(event)">
                <span id="authorDisplay">全部</span>
                <span style="font-size:0.6rem; margin-left:auto">&#9662;</span>
            </div>
            <div id="authorDropdown" class="multi-dropdown" style="display:none">
                <div class="multi-opt" onclick="toggleAllAuthors(event)">
                    <input type="checkbox" id="authorSelectAll" checked> <span>全部</span>
                </div>
                <div id="authorOptions"></div>
            </div>
            <input type="hidden" id="filterAuthor" value="">
        </div>
        <div class="filter-group">
            <label>状态</label>
            <select id="filterStatus">
                <option value="success">已完成</option>
                <option value="all">全部</option>
                <option value="processing">处理中</option>
                <option value="failed">失败</option>
            </select>
        </div>
        <div class="filter-group">
            <label>已读</label>
            <select id="filterRead" onchange="serializeFiltersToURL(); applyReadFilter()">
                <option value="all">全部</option>
                <option value="unread">未读</option>
                <option value="read">已读</option>
            </select>
        </div>
        <div class="filter-group" style="min-width:200px; flex:1">
            <label>搜索</label>
            <input type="text" id="filterQ" placeholder="标题 / 频道 / URL..."
                   style="width:100%; background:var(--bg-secondary); border:1px solid var(--border-primary);
                          border-radius:8px; padding:7px 10px; color:var(--text-primary); font-size:0.8rem;">
        </div>
        <div class="filter-actions">
            <button class="btn btn-primary" onclick="applyFilter()">搜索</button>
            <button class="btn btn-ghost" onclick="resetFilter()">重置</button>
        </div>
    </div>

    <!-- 统计条 -->
    <div class="stats-bar" id="statsBar" style="display:none">
        <input type="checkbox" id="selectAllChk" class="row-checkbox" title="全选当页" onchange="toggleSelectAll(this.checked)">
        <span id="totalCount"></span>
        <span class="unread-badge" id="unreadBadge" style="display:none"></span>
        <span id="selectedCount" style="display:none; color:var(--accent-primary); font-weight:600"></span>
        <button class="btn btn-ghost" id="markSelectedBtn" onclick="markSelectedRead()" style="display:none; font-size:0.75rem; padding:3px 10px">
            标记已读
        </button>
        <button class="btn btn-ghost" onclick="markAllRead()" style="font-size:0.75rem; padding:3px 10px">
            全部标为已读
        </button>
    </div>

    <!-- 列表区 -->
    <div id="listArea">
        <div class="state-box">
            <div class="icon">🔑</div>
            <div>输入 API Key 后点击查询</div>
        </div>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="paginationBar" style="display:none">
        <button class="page-btn" id="prevBtn" onclick="changePage(-1)" disabled>← 上一页</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="page-btn" id="nextBtn" onclick="changePage(1)" disabled>下一页 →</button>
    </div>
</div>

<!-- 摘要预览卡片 -->
<div class="summary-tooltip" id="summaryTooltip">
    <div class="summary-tooltip-title" id="tooltipTitle"></div>
    <div id="tooltipContent"></div>
</div>
</section>
</main>

<script>
// ===================== 状态 =====================
const STORAGE_KEY_READ  = () => `vta_read_${getMasked()}`;
const STORAGE_KEY_ALIAS = () => `vta_webhook_alias_${getMasked()}`;
const PAGE_SIZE = 20;

let currentPage = 0;
let totalItems  = 0;
let currentApiKey = '';
let currentMasked = '';
let filterOptions = { webhooks: [], platforms: [], authors: [] };
let summaryDebounce = null;
let summaryVisible  = false;
let selectedSet = new Set();   // 当前选中的 view_token

// ===================== 工具函数 =====================
function getMasked() { return currentMasked || 'anon'; }

function getReadSet() {
    try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY_READ()) || '[]')); }
    catch { return new Set(); }
}
function saveReadSet(s) {
    localStorage.setItem(STORAGE_KEY_READ(), JSON.stringify([...s]));
}
function markRead(viewToken) {
    const s = getReadSet(); s.add(viewToken); saveReadSet(s);
}
function markAllRead() {
    const rows = document.querySelectorAll('.task-row[data-vt]');
    const s = getReadSet();
    rows.forEach(r => s.add(r.dataset.vt));
    saveReadSet(s);
    renderReadState();
    applyReadFilter();
}

// ===================== 多选 =====================
function toggleSelect(vt, chkEl, rowEl) {
    if (selectedSet.has(vt)) {
        selectedSet.delete(vt);
        chkEl.checked = false;
        rowEl.classList.remove('selected');
    } else {
        selectedSet.add(vt);
        chkEl.checked = true;
        rowEl.classList.add('selected');
    }
    updateSelectionUI();
}

function toggleSelectAll(checked) {
    const rows = document.querySelectorAll('.task-row[data-vt]');
    rows.forEach(row => {
        const vt = row.dataset.vt;
        const chk = row.querySelector('.row-checkbox');
        if (checked) {
            selectedSet.add(vt);
            if (chk) chk.checked = true;
            row.classList.add('selected');
        } else {
            selectedSet.delete(vt);
            if (chk) chk.checked = false;
            row.classList.remove('selected');
        }
    });
    updateSelectionUI();
}

function updateSelectionUI() {
    const count = selectedSet.size;
    const cntEl = document.getElementById('selectedCount');
    const btnEl = document.getElementById('markSelectedBtn');
    if (count > 0) {
        cntEl.style.display = '';
        cntEl.textContent = `已选 ${count} 条`;
        btnEl.style.display = '';
        btnEl.textContent = `标记已读 (${count})`;
    } else {
        cntEl.style.display = 'none';
        btnEl.style.display = 'none';
    }
    // 更新全选框的状态
    const allRows = document.querySelectorAll('.task-row[data-vt]');
    const selAll = document.getElementById('selectAllChk');
    if (allRows.length > 0 && count === allRows.length) {
        selAll.checked = true; selAll.indeterminate = false;
    } else if (count > 0) {
        selAll.checked = false; selAll.indeterminate = true;
    } else {
        selAll.checked = false; selAll.indeterminate = false;
    }
}

function markSelectedRead() {
    const s = getReadSet();
    selectedSet.forEach(vt => s.add(vt));
    saveReadSet(s);
    selectedSet.clear();
    document.querySelectorAll('.task-row.selected').forEach(row => {
        row.classList.remove('selected');
        const chk = row.querySelector('.row-checkbox');
        if (chk) chk.checked = false;
    });
    updateSelectionUI();
    renderReadState();
    applyReadFilter();
}

// ===================== 已读过滤（触发重新拉取+客户端过滤） =====================
function applyReadFilter() {
    currentPage = 0;
    fetchHistory();
}

// ===================== 过滤偏好持久化 =====================
// ===================== URL 参数过滤状态 =====================
// 所有过滤条件存在 URL 里，刷新/分享均保留；API Key 不入 URL（安全）

function serializeFiltersToURL() {
    const params = new URLSearchParams();
    const get = id => document.getElementById(id)?.value.trim() || '';

    const q         = get('filterQ');
    const startDate = get('filterStartDate');
    const endDate   = get('filterEndDate');
    const webhook   = get('filterWebhook');
    const platform  = get('filterPlatform');
    const author    = get('filterAuthor');
    const status    = get('filterStatus');
    const read      = get('filterRead');

    if (q)         params.set('q', q);
    if (startDate) params.set('start_date', startDate);
    if (endDate)   params.set('end_date', endDate);
    // webhook 含密钥，不写入 URL
    if (platform)  params.set('platform', platform);
    if (author)    params.set('author', author);
    // 默认值不写入 URL，保持简洁
    if (status && status !== 'success') params.set('status', status);
    if (read   && read   !== 'all')     params.set('read', read);

    const qs = params.toString();
    history.replaceState(null, '', qs ? `?${qs}` : window.location.pathname);
}

function loadFiltersFromURL() {
    // 必须在 populateFilterDropdowns() 之后调用，webhook 选项才存在
    const params = new URLSearchParams(window.location.search);
    const set = (id, key) => {
        const val = params.get(key);
        if (val !== null) { const el = document.getElementById(id); if (el) el.value = val; }
    };
    set('filterQ',          'q');
    set('filterStartDate',  'start_date');
    set('filterEndDate',    'end_date');
    // webhook 不从 URL 读取
    set('filterPlatform',   'platform');
    // 频道多选：从 URL 恢复选中状态
    const authorParam = params.get('author');
    if (authorParam) {
        const selected = new Set(authorParam.split(',').map(s => s.trim()));
        document.querySelectorAll('#authorOptions input[type=checkbox]').forEach(chk => {
            chk.checked = selected.has(chk.value);
        });
        document.getElementById('filterAuthor').value = authorParam;
        updateAuthorDisplay();
    }
    set('filterStatus',     'status');
    set('filterRead',       'read');
}

function getAliasMap() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_ALIAS()) || '{}'); }
    catch { return {}; }
}
function saveAliasMap(m) {
    localStorage.setItem(STORAGE_KEY_ALIAS(), JSON.stringify(m));
}
function getAlias(url) { return getAliasMap()[url] || url; }
function shortWebhook(url) {
    const alias = getAlias(url);
    if (alias !== url) return alias;
    // 显示 URL 末尾片段
    try {
        const u = new URL(url);
        const key = u.searchParams.get('key');
        return key ? `key=…${key.slice(-6)}` : url.slice(-30);
    } catch { return url.slice(-30); }
}

const PLATFORM_LABELS = {
    youtube: 'YouTube',
    bilibili: 'Bilibili',
    xiaoyuzhou: '小宇宙',
    xiaohongshu: '小红书',
    douyin: '抖音',
};

// ===================== Auth =====================
function loadSavedKey() {
    const persisted = localStorage.getItem('vta_api_key_persist');
    const session = sessionStorage.getItem('vta_api_key');
    const saved = persisted || session;
    if (saved) {
        document.getElementById('apiKeyInput').value = saved;
    }
}

async function loadHistory(page = 0) {
    const keyInput = document.getElementById('apiKeyInput').value.trim();
    if (!keyInput) { showStatus('err', '请输入 API 访问令牌'); return; }

    currentApiKey = keyInput;
    sessionStorage.setItem('vta_api_key', keyInput);
    // 静默记住令牌（仅存本浏览器），下次自动带入
    localStorage.setItem('vta_api_key_persist', keyInput);
    currentPage = page;

    showListLoading();

    // 先拿过滤选项（首次加载）
    if (page === 0) {
        await loadFilterOptions();
    }

    await fetchHistory();
}

async function loadFilterOptions() {
    try {
        const res = await apiFetch('/api/audit/filter-options');
        if (res.code === 200) {
            filterOptions = res.data;
            currentMasked = res.data.api_key_masked || '';
            populateFilterDropdowns();
            loadFiltersFromURL();   // 恢复 URL 里的过滤条件（必须在下拉填充后）
            document.getElementById('filterBar').style.display = 'flex';
            document.getElementById('statsBar').style.display = 'flex';
        }
    } catch(e) {
        console.error('filter-options error', e);
    }
}

function populateFilterDropdowns() {
    const platformSel = document.getElementById('filterPlatform');
    platformSel.innerHTML = '<option value="">全部</option>';
    filterOptions.platforms.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = PLATFORM_LABELS[p] || p;
        platformSel.appendChild(opt);
    });

    // 频道：填充多选 checkbox 列表
    const authorContainer = document.getElementById('authorOptions');
    authorContainer.innerHTML = '';
    filterOptions.authors.forEach(a => {
        const div = document.createElement('div');
        div.className = 'multi-opt';
        div.innerHTML = `<input type="checkbox" value="${esc(a)}" checked onchange="updateAuthorFilter(event)"> <span>${esc(a)}</span>`;
        div.addEventListener('click', e => {
            if (e.target.tagName !== 'INPUT') {
                const chk = div.querySelector('input'); chk.checked = !chk.checked;
                updateAuthorFilter();
            }
        });
        authorContainer.appendChild(div);
    });
    updateAuthorDisplay();
}

// ===================== 频道多选交互 =====================
let _authorDropOpen = false;

function toggleAuthorDropdown(e) {
    e.stopPropagation();
    const dd = document.getElementById('authorDropdown');
    _authorDropOpen = !_authorDropOpen;
    dd.style.display = _authorDropOpen ? 'block' : 'none';
}

function updateAuthorFilter(e) {
    if (e) e.stopPropagation();
    const checks = document.querySelectorAll('#authorOptions input[type=checkbox]');
    const selected = [...checks].filter(c => c.checked).map(c => c.value);
    const allChk = document.getElementById('authorSelectAll');

    if (selected.length === checks.length || selected.length === 0) {
        allChk.checked = true; allChk.indeterminate = false;
        document.getElementById('filterAuthor').value = '';
    } else {
        allChk.checked = false; allChk.indeterminate = true;
        document.getElementById('filterAuthor').value = selected.join(',');
    }
    updateAuthorDisplay();
    serializeFiltersToURL();
}

function toggleAllAuthors(e) {
    e.stopPropagation();
    const allChk = document.getElementById('authorSelectAll');
    if (e.target.tagName !== 'INPUT') allChk.checked = !allChk.checked;
    const checks = document.querySelectorAll('#authorOptions input[type=checkbox]');
    checks.forEach(c => c.checked = allChk.checked);
    allChk.indeterminate = false;
    document.getElementById('filterAuthor').value = '';
    updateAuthorDisplay();
    serializeFiltersToURL();
}

function updateAuthorDisplay() {
    const checks = document.querySelectorAll('#authorOptions input[type=checkbox]');
    const selected = [...checks].filter(c => c.checked).map(c => c.value);
    const display = document.getElementById('authorDisplay');
    if (selected.length === 0 || selected.length === checks.length) {
        display.textContent = '全部';
    } else if (selected.length <= 2) {
        display.textContent = selected.join(', ');
    } else {
        display.textContent = `${selected[0]} +${selected.length - 1}`;
    }
}

// 点击下拉内部不关闭，点击外部才关闭
document.getElementById('authorDropdown').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => {
    if (_authorDropOpen) {
        document.getElementById('authorDropdown').style.display = 'none';
        _authorDropOpen = false;
    }
});

// ===================== 过滤 =====================
function applyFilter() { serializeFiltersToURL(); loadHistory(0); }
function resetFilter() {
    document.getElementById('filterStartDate').value = '';
    document.getElementById('filterEndDate').value = '';
    document.getElementById('filterPlatform').value = '';
    document.getElementById('filterAuthor').value = '';
    document.getElementById('filterStatus').value = 'success';
    document.getElementById('filterRead').value = 'all';
    const qEl = document.getElementById('filterQ'); if (qEl) qEl.value = '';
    history.replaceState(null, '', window.location.pathname);  // 清空 URL 参数
    loadHistory(0);
}
function changePage(delta) {
    const maxPage = Math.ceil(totalItems / PAGE_SIZE) - 1;
    currentPage = Math.max(0, Math.min(maxPage, currentPage + delta));
    if (_filteredItems) {
        // 客户端已缓存全量过滤结果，直接切片渲染，无需再请求
        const pageItems = _filteredItems.slice(
            currentPage * PAGE_SIZE,
            (currentPage + 1) * PAGE_SIZE
        );
        selectedSet.clear(); updateSelectionUI();
        renderList(pageItems);
        renderPagination();
    } else {
        fetchHistory();
    }
}

// ===================== API 请求 =====================
async function apiFetch(url, params = {}) {
    const qs = new URLSearchParams(params).toString();
    const fullUrl = qs ? `${url}?${qs}` : url;
    const res = await fetch(fullUrl, {
        headers: { 'Authorization': `Bearer ${currentApiKey}` }
    });
    const json = await res.json();
    if (res.status === 401) { showStatus('err', '访问令牌无效'); throw new Error('401'); }
    return json;
}

// 缓存客户端过滤后的全量数据（仅已读/未读过滤激活时使用）
let _filteredItems = null;

async function fetchHistory() {
    const readFilter = document.getElementById('filterRead')?.value || 'all';
    const isReadFiltered = readFilter !== 'all';

    const params = {};
    if (isReadFiltered) {
        // 已读/未读过滤是客户端行为，需拉全量数据再分页
        params.limit = 10000;
        params.offset = 0;
    } else {
        params.limit = PAGE_SIZE;
        params.offset = currentPage * PAGE_SIZE;
    }

    const startDate = document.getElementById('filterStartDate').value;
    const endDate   = document.getElementById('filterEndDate').value;
    const platform  = document.getElementById('filterPlatform').value;
    const author    = document.getElementById('filterAuthor').value;
    const status    = document.getElementById('filterStatus').value;
    const q = document.getElementById('filterQ')?.value.trim() || '';

    if (startDate) params.start_date = startDate;
    if (endDate)   params.end_date = endDate;
    if (platform)  params.platform = platform;
    if (author)    params.author = author;
    if (status)    params.status = status;
    if (q)         params.q = q;

    try {
        const res = await apiFetch('/api/audit/history', params);
        if (res.code !== 200) { showError(res.message || '查询失败'); return; }

        currentMasked = res.data.api_key_masked || currentMasked;
        selectedSet.clear();
        updateSelectionUI();

        if (isReadFiltered) {
            // 客户端过滤 + 客户端分页
            const readSet = getReadSet();
            _filteredItems = res.data.items.filter(item => {
                const isRead = item.view_token && readSet.has(item.view_token);
                return readFilter === 'unread' ? !isRead : isRead;
            });
            totalItems = _filteredItems.length;
            const pageItems = _filteredItems.slice(
                currentPage * PAGE_SIZE,
                (currentPage + 1) * PAGE_SIZE
            );
            renderList(pageItems);
        } else {
            _filteredItems = null;
            totalItems = res.data.total;
            renderList(res.data.items);
        }

        renderPagination();
        updateUnreadBadge(res.data.items);
    } catch(e) {
        if (e.message === '401') {
            // 令牌无效：列表区给出明确提示，避免永远停在“加载中…”
            document.getElementById('listArea').innerHTML =
                `<div class="state-box"><div class="icon">🔑</div><div>访问令牌无效或已过期，请在上方输入正确的令牌后点击「查询」</div></div>`;
        } else {
            showError('网络错误，请稍后重试');
        }
    }
}

// ===================== 渲染 =====================
function renderList(items) {
    const area = document.getElementById('listArea');
    if (!items.length) {
        area.innerHTML = `<div class="state-box"><div class="icon">📭</div><div>暂无符合条件的任务记录</div></div>`;
        return;
    }

    const readSet = getReadSet();
    const rows = items.map(item => buildRow(item, readSet));
    area.innerHTML = `<div class="task-list">${rows.join('')}</div>`;

    // 绑定 hover 摘要 + checkbox
    document.querySelectorAll('.task-row[data-vt]').forEach(row => {
        row.addEventListener('mouseenter', onRowHover);
        row.addEventListener('mousemove', onRowMove);
        row.addEventListener('mouseleave', onRowLeave);
        const chk = row.querySelector('.row-checkbox');
        if (chk) {
            chk.addEventListener('click', e => {
                e.stopPropagation();   // 不触发行点击
                toggleSelect(row.dataset.vt, chk, row);
            });
        }
    });
    // 重渲染（翻页/筛选）后清空选择，避免“复选框已重置但 selectedSet 残留”导致全选无法取消
    selectedSet.clear();
    updateSelectionUI();
}

function buildRow(item, readSet) {
    const isCompleted = item.status === 'success';
    const isRead = isCompleted && item.view_token && readSet.has(item.view_token);
    const canClick = isCompleted && item.view_token;

    const rawTime = item.request_time_display || item.request_time;
    const time = rawTime
        ? rawTime.replace('T', ' ').slice(0, 16)
        : '—';

    const platformLabel = item.platform ? (PLATFORM_LABELS[item.platform] || item.platform) : '—';

    const classes = ['task-row', 'task-card'];
    if (isRead) classes.push('read');
    if (!isRead && canClick) classes.push('unread');

    const vtAttr = canClick ? `data-vt="${esc(item.view_token)}"` : '';
    const clickHandler = canClick
        ? `onclick="openTask('${esc(item.view_token)}', this)"`
        : '';

    const checkboxHtml = canClick
        ? `<div style="display:flex;align-items:center;margin-right:12px;margin-top:2px;"><input type="checkbox" class="row-checkbox" onclick="event.stopPropagation()"></div>`
        : ``;

    let statusCls = '';
    let statusTxt = item.status;
    if (item.status === 'success') { statusCls = 'status-completed'; statusTxt = '已完成'; }
    else if (item.status === 'failed') { statusCls = 'status-failed'; statusTxt = '失败'; }
    else { statusCls = 'status-processing'; statusTxt = '处理中'; }

    const titleText = item.title || item.video_url || '(无标题)';

    return `
        <div class="${classes.join(' ')}" ${vtAttr} style="${canClick ? 'cursor:pointer;' : ''}">
            <div class="task-header" ${clickHandler}>
                <div style="display:flex; flex:1; min-width:0;">
                    ${checkboxHtml}
                    <div class="task-meta">
                        <div class="task-title" title="${esc(titleText)}">${esc(titleText)}</div>
                        <div class="task-subtitle">
                            <span>${time}</span>
                            ${item.author ? `<span>·</span><span>${esc(item.author)}</span>` : ''}
                            <span>·</span><span>${platformLabel}</span>
                        </div>
                    </div>
                </div>
                <div><span class="task-status ${statusCls}">${statusTxt}</span></div>
            </div>
            ${item.error ? `<div class="task-body"><div class="task-error">${esc(item.error)}</div></div>` : ''}
        </div>`;
}

function renderReadState() {
    const readSet = getReadSet();
    document.querySelectorAll('.task-row[data-vt]').forEach(row => {
        const vt = row.dataset.vt;
        if (readSet.has(vt)) {
            row.classList.add('read');
            row.classList.remove('unread');
        }
    });
    updateUnreadBadgeFromDOM();
}

function updateUnreadBadge(items) {
    const readSet = getReadSet();
    const unread = items.filter(i => i.view_token && !readSet.has(i.view_token) && i.status === 'success').length;
    const badge = document.getElementById('unreadBadge');
    const total = document.getElementById('totalCount');
    total.textContent = `共 ${totalItems} 条`;
    if (unread > 0) {
        badge.style.display = '';
        badge.textContent = `${unread} 条未读`;
    } else {
        badge.style.display = 'none';
    }
}

function updateUnreadBadgeFromDOM() {
    const readSet = getReadSet();
    const rows = document.querySelectorAll('.task-row[data-vt]');
    let unread = 0;
    rows.forEach(r => { if (!readSet.has(r.dataset.vt)) unread++; });
    const badge = document.getElementById('unreadBadge');
    badge.style.display = unread > 0 ? '' : 'none';
    badge.textContent = `${unread} 条未读`;
}

function renderPagination() {
    const bar = document.getElementById('paginationBar');
    const totalPages = Math.ceil(totalItems / PAGE_SIZE);
    if (totalPages <= 1) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    document.getElementById('pageInfo').textContent = `第 ${currentPage + 1} / ${totalPages} 页`;
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
}

// ===================== 交互 =====================
function openTask(viewToken, rowEl) {
    markRead(viewToken);
    rowEl.classList.add('read');
    const dot = rowEl.querySelector('.read-dot');
    if (dot) dot.remove();
    updateUnreadBadgeFromDOM();
    window.open(`/view/${viewToken}`, '_blank');
}

// ===================== 摘要预览 =====================
function onRowHover(e) {
    const rowEl = e.currentTarget;   // 必须在 handler 内先存引用，setTimeout 后 currentTarget 会被置 null
    const vt = rowEl.dataset.vt;
    if (!vt) return;
    summaryDebounce = setTimeout(() => fetchSummary(vt, rowEl), 300);
}
function onRowMove(e) {
    const tooltip = document.getElementById('summaryTooltip');
    if (summaryVisible) positionTooltip(e);
}
function onRowLeave() {
    clearTimeout(summaryDebounce);
    setTimeout(() => {
        document.getElementById('summaryTooltip').classList.remove('visible');
        summaryVisible = false;
    }, 150);
}

async function fetchSummary(viewToken, rowEl) {
    try {
        const res = await apiFetch('/api/audit/summary', { view_token: viewToken });
        if (res.code === 200) {
            const title = rowEl.querySelector('.task-title')?.textContent || '';
            document.getElementById('tooltipTitle').textContent = title;
            document.getElementById('tooltipContent').textContent = res.data.summary || '（暂无摘要）';
            const tooltip = document.getElementById('summaryTooltip');
            tooltip.classList.add('visible');
            summaryVisible = true;

            // position:fixed 相对视口，不加 scrollY
            const rect = rowEl.getBoundingClientRect();
            const top = rect.bottom + 8;
            const left = Math.min(rect.left, window.innerWidth - 360);
            // 若下方空间不足，改为显示在行上方
            const fitsBelow = top + 200 < window.innerHeight;
            tooltip.style.top = fitsBelow ? top + 'px' : (rect.top - 8 - 200) + 'px';
            tooltip.style.left = Math.max(0, left) + 'px';
        }
    } catch(e) { /* 静默失败 */ }
}

function positionTooltip(e) {
    const tooltip = document.getElementById('summaryTooltip');
    // clientY/clientX 对应 position:fixed 的视口坐标
    tooltip.style.top = Math.min(e.clientY + 12, window.innerHeight - 220) + 'px';
    tooltip.style.left = Math.min(e.clientX + 8, window.innerWidth - 360) + 'px';
}

// ===================== Webhook 别名 =====================
function toggleAliasPanel() {
    const panel = document.getElementById('aliasPanel');
    panel.classList.toggle('visible');
    if (panel.classList.contains('visible')) buildAliasRows();
}

function buildAliasRows() {
    const aliasMap = getAliasMap();
    const container = document.getElementById('aliasRows');
    container.innerHTML = filterOptions.webhooks.map(w => `
        <div class="alias-row">
            <span class="alias-url" title="${esc(w)}">${esc(w)}</span>
            <input class="alias-input" type="text" placeholder="设置别名..."
                   data-url="${esc(w)}"
                   value="${esc(aliasMap[w] || '')}">
        </div>
    `).join('');
}

function saveAliases() {
    const inputs = document.querySelectorAll('.alias-input');
    const map = {};
    inputs.forEach(inp => {
        const url = inp.dataset.url;
        const alias = inp.value.trim();
        if (alias) map[url] = alias;
    });
    saveAliasMap(map);
    populateFilterDropdowns();
    showStatus('ok', '别名已保存');
}

// ===================== UI 辅助 =====================
function showListLoading() {
    document.getElementById('listArea').innerHTML =
        `<div class="state-box"><div class="icon">—</div><div>加载中...</div></div>`;
}
function showError(msg) {
    document.getElementById('listArea').innerHTML =
        `<div class="state-box"><div class="icon">!</div><div>${esc(msg)}</div><br>
         <button class="btn btn-ghost" onclick="loadHistory(0)" style="margin-top:8px">重试</button></div>`;
}
function showStatus(type, msg) {
    const el = document.getElementById('authStatus');
    el.style.display = '';
    el.className = `auth-status ${type}`;
    el.textContent = msg;
}
function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===================== 回车触发查询 =====================
document.getElementById('apiKeyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadHistory(0);
});

// 过滤栏任意子元素 change → 实时写入 URL（冒泡监听，无需逐一绑定）
document.addEventListener('DOMContentLoaded', () => {
    const bar = document.getElementById('filterBar');
    if (bar) bar.addEventListener('change', serializeFiltersToURL);

    // 搜索框：回车立即搜索，输入 500ms 防抖自动搜索
    const qInput = document.getElementById('filterQ');
    if (!qInput) return;
    qInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { clearTimeout(searchDebounce); serializeFiltersToURL(); loadHistory(0); }
    });
    qInput.addEventListener('input', () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => { serializeFiltersToURL(); loadHistory(0); }, 500);
    });
});
let searchDebounce = null;

// ===================== 从主页 localStorage 读取 Token（与主页共用同一 Key）=====================
function tryLoadMainPageToken() {
    // 主页用简单加密存在 vta_bearer_token，加密 key 是固定字符串
    const ENCRYPT_KEY = 'vta_encrypt_key_2024';
    function simpleDecrypt(encoded) {
        if (!encoded) return '';
        try {
            const reversed = encoded.split('').reverse().join('');
            const decoded = decodeURIComponent(escape(atob(reversed)));
            return decoded.replace(ENCRYPT_KEY, '');
        } catch (e) { return ''; }
    }
    const raw = localStorage.getItem('vta_bearer_token');
    return raw ? simpleDecrypt(raw) : '';
}

// ===================== 初始化 =====================
loadSavedKey();
// 如果没有缓存的 key，尝试从主页自动填入
if (!document.getElementById('apiKeyInput').value) {
    const mainKey = tryLoadMainPageToken();
    if (mainKey) document.getElementById('apiKeyInput').value = mainKey;
}
// 有 key 就自动查询，无需手动点击
if (document.getElementById('apiKeyInput').value) {
    loadHistory();
}
