        (function() {
            try {
                var theme = localStorage.getItem('vta_theme_preference');
                if (theme) {
                    var parsedTheme = theme;
                    try { parsedTheme = JSON.parse(theme); } catch(e) {}
                    document.documentElement.setAttribute('data-theme', parsedTheme);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch(e) {}
        })();
    </script>

        <section class="page-stage">
    <div class="container app-home">
        <header class="header workbench-hero">
            <h1 class="serif">把任意内容，秒变可读精华</h1>
            <p>将音视频与文档，提炼为结构化的高质量笔记，支持多平台链接抓取。</p>
        </header>

        <div class="main-content">
            <!-- ===== 输入卡片：链接 / 本地文件 / 文字 ===== -->
            <div class="input-card">
                <div class="input-tabs" role="tablist">
                    <button type="button" class="input-tab active" id="tab-link"
                            data-panel="panel-link" role="tab" aria-controls="panel-link"
                            aria-selected="true" tabindex="0">
                        粘贴链接
                    </button>
                    <button type="button" class="input-tab" id="tab-file"
                            data-panel="panel-file" role="tab" aria-controls="panel-file"
                            aria-selected="false" tabindex="-1">
                        本地文件
                    </button>
                    <button type="button" class="input-tab" id="tab-text"
                            data-panel="panel-text" role="tab" aria-controls="panel-text"
                            aria-selected="false" tabindex="-1">
                        粘贴文字
                    </button>
                </div>

                <!-- 链接面板 -->
                <div class="input-panel active" id="panel-link" role="tabpanel" aria-labelledby="tab-link">
                    <form id="transcribe-form" class="form-container" autocomplete="off" data-form-type="other">
                        <div class="form-group">
                            <label class="sr-only" for="share-content">链接或待解析内容</label>
                            <textarea
                                id="share-content"
                                name="deep-learning-source-content"
                                class="form-textarea"
                                autocomplete="off"
                                autocorrect="off"
                                autocapitalize="none"
                                spellcheck="false"
                                aria-autocomplete="none"
                                data-lpignore="true"
                                data-1p-ignore="true"
                                data-form-type="other"
                                placeholder="粘贴链接（如 视频号, 公众号, 小红书, Bilibili, YouTube）或长文本内容..."
                                rows="3"></textarea>

                            <!-- URL 提取与选择（app.js 既有机制） -->
                            <div id="url-preview" class="url-preview" hidden>
                                <div class="no-urls">等待输入链接…</div>
                            </div>

                            <!-- 识别结果横幅：告诉用户"将执行什么" -->
                            <div id="detect-banner" class="detect-banner" hidden></div>
                        </div>



                        <div class="form-group">
                            <button type="submit" id="submit-btn" class="submit-btn" disabled>
                                <span class="btn-icon" aria-hidden="true">↗</span>
                                <span class="btn-text">开始解析</span>
                            </button>
                            <div id="submit-hint" class="submit-hint" role="status" aria-live="polite"></div>
                        </div>
                    </form>
                </div>

                <!-- 本地文件面板：视频/音频上传转录 -->
                <div class="input-panel" id="panel-file" role="tabpanel" aria-labelledby="tab-file" hidden>
                    <input type="file" id="file-input"
                           accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.flac,.mp4,.mov,.mkv,.webm,.txt,.md,.markdown,.csv,.log,.html,.htm,.pdf,.docx"
                           hidden>
                    <button type="button" class="file-dropzone" id="file-dropzone" aria-describedby="dropzone-hint">
                        <div class="dropzone-icon" aria-hidden="true">+</div>
                        <div class="dropzone-title">拖拽视频 / 音频 / 文档到此处，或点击选择</div>
                        <div class="dropzone-sub">音视频 → 本地学习模式　·　文档(pdf/docx/txt/md/html) → 提取分析</div>
                        <div class="dropzone-badge" id="dropzone-hint">支持 视频 / 音频 / 文档 · 本地长视频可边看边读文稿</div>
                    </button>
                </div>

                <div class="input-panel" id="panel-text" role="tabpanel" aria-labelledby="tab-text" hidden>
                    <form id="study-text-form" class="form-container" autocomplete="off">
                        <div class="form-group">
                            <label class="form-label" for="study-text-title">标题</label>
                            <input class="form-input" id="study-text-title" type="text"
                                   maxlength="160" placeholder="可选，留空时使用正文首行">
                        </div>
                        <div class="form-group">
                            <label class="form-label required" for="study-text-content">正文</label>
                            <textarea class="form-textarea" id="study-text-content"
                                      maxlength="200000" rows="10"
                                      placeholder="粘贴文章、笔记或其他文字内容"></textarea>
                        </div>
                        <div class="form-group">
                            <button type="submit" id="study-text-submit" class="submit-btn" disabled>
                                <span class="btn-icon" aria-hidden="true">↗</span>
                                <span class="btn-text">开始学习</span>
                            </button>
                            <div id="study-text-status" class="submit-hint" role="status" aria-live="polite"></div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 状态显示 -->
            <div id="status-container" class="status-container" style="display: none;">
                <div id="status-content" class="status-content"></div>
            </div>
            <!-- 历史记录 -->
            <div id="history-container" class="history-container" style="display: none;">
                <div class="history-header">
                    <h3>最近解析</h3>
                    <div class="history-controls">
                        <div class="history-filter" id="history-filter">
                            <button type="button" class="filter-chip active" data-filter="all">全部</button>
                            <button type="button" class="filter-chip" data-filter="marked">精华</button>
                            <button type="button" class="filter-chip" data-filter="video">视频</button>
                            <button type="button" class="filter-chip" data-filter="post">帖文</button>
                            <button type="button" class="filter-chip" data-filter="file">文件</button>
                        </div>
                        <select id="history-status" class="hist-date-select" aria-label="按状态筛选">
                            <option value="all">全部状态</option>
                            <option value="done">成功</option>
                            <option value="failed">失败</option>
                            <option value="running">处理中</option>
                        </select>
                        <select id="history-date" class="hist-date-select" aria-label="按日期筛选">
                            <option value="all">全部时间</option>
                            <option value="today">今天</option>
                            <option value="7d">近 7 天</option>
                            <option value="30d">近 30 天</option>
                            <option value="90d">近 90 天</option>
                        </select>
                    </div>
                </div>
                <div id="history-list" class="history-list"></div>
                <div id="history-pagination" class="history-pagination"></div>
            </div>
        </div> <!-- end main-content -->

        <footer class="footer">
            <p>Powered by <a href="https://github.com/zhangxun-ai/LearnFlux" target="_blank" rel="noopener">LearnFlux</a> · Open Source · <a href="https://github.com/zhangxun-ai/LearnFlux" target="_blank" rel="noopener">☆ Star on GitHub</a></p>
        </footer>
    </div>
        </section>
    </main>
