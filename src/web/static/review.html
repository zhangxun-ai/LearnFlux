            <form class="review-search-form" id="review-search-form">
                <label class="review-field review-field-wide"><span>关键词</span><input name="keyword" type="search" placeholder="搜索事实、意义、洞察或行动"></label>

                <label class="review-field"><span>结束日期</span><input name="end_date" type="date"></label>
                <label class="review-field"><span>记录类型</span><select name="record_type"><option value="">全部</option><option value="daily">每日</option><option value="weekly">周度</option><option value="monthly">月度</option><option value="annual">年度</option><option value="insight">洞察</option><option value="experiment">行动实验</option></select></label>
                <label class="review-field"><span>意义</span><select name="meaning_type"><option value="">全部</option><option value="discovery">发现</option><option value="learning">学习</option><option value="decision">决心</option><option value="joy">快乐</option><option value="hunch">预感</option></select></label>
                <label class="review-field"><span>情绪</span><input name="emotion" placeholder="例如：担心"></label>
                <label class="review-field"><span>洞察层级</span><select name="insight_tier"><option value="">全部</option><option value="branch">枝叶</option><option value="trunk">树干</option><option value="root">树根</option></select></label>
                <label class="review-field"><span>状态</span><select name="status"><option value="">全部</option><option value="active">进行中</option><option value="pending">待确认</option><option value="observing">继续观察</option><option value="accepted">我认可</option><option value="rejected">我不认可</option><option value="disproved">已被证伪</option><option value="planned">待实验</option><option value="completed">已完成</option><option value="stopped">已停止</option></select></label>
                <button class="review-button review-button-primary" type="submit">搜索</button>
            </form>
            <div class="review-search-results" id="review-search-results" aria-live="polite"></div>
