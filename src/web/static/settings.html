        <script>
        (function() {
            try {
                var theme = localStorage.getItem('vta_theme_preference');
                if (theme) {
                    var parsedTheme = theme;
                    try { parsedTheme = JSON.parse(theme); } catch(e) {}
                    document.documentElement.setAttribute('data-theme', parsedTheme);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch(e) {}
        })();
    </script>

    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root, [data-theme="light"], [data-theme="dark"] {
            --st-accent: var(--accent-primary);
            --st-accent-hover: var(--accent-hover);
            --st-accent-soft: var(--accent-soft);
            --st-card: var(--bg-primary);
            --st-card-secondary: var(--bg-secondary);
            --st-border: var(--border-primary);
            --st-border-hover: var(--border-strong);
            --st-shadow: var(--shadow-sm);
            --st-shadow-hover: var(--shadow);
            --st-radius: 12px;
            --st-radius-lg: 16px;
        }
        body {
            min-height: 100vh; color: var(--ink);
        }
        .st-page { max-width: 900px; margin: 0 auto; padding: 40px 24px 100px; }
        .st-head { margin-bottom: 32px; }
        .st-head h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 2.2rem; color: var(--text-primary); }
        .st-head p { margin-top: 8px; color: var(--text-secondary); font-size: 1.05rem; }
        
        .card { 
            background: var(--card); 
            border: 1px solid rgba(27, 26, 23, 0.08); 
            border-radius: var(--radius-card);
            padding: 28px 32px; 
            margin-top: 24px; 
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { transform: translateY(-2px); }
        .card h2 { font-size: 1.15rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; font-weight: 600; }
        .card .card-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; }
        
        .adv-block { padding-top: 20px; margin-top: 20px; border-top: 1px dashed var(--st-border); }
        .adv-block:first-of-type { border-top: none; margin-top: 8px; }
        .adv-block h3 { font-size: 1rem; margin-bottom: 16px; font-weight: 600; color: var(--text-primary); }
        
        .field { margin-bottom: 20px; }
        .field:last-child { margin-bottom: 0; }
        .field label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
        .field input[type=text], .field input[type=password], .field input[type=number], .field select {
            width: 100%; padding: 12px 16px; border: 1px solid var(--line);
            border-radius: var(--radius-control); font-size: 0.95rem; background: var(--card-translucent-light);
            color: var(--ink); font-family: inherit; transition: all 0.2s; box-shadow: inset 0 1px 2px rgba(27, 26, 23, 0.02);
        }
        .field input:focus, .field select:focus { 
            outline: none; border-color: var(--accent); 
            box-shadow: 0 0 0 3px var(--accent-soft); 
            background: var(--card);
        }
        .field .hint { font-size: 0.85rem; color: var(--text-tertiary); margin-top: 8px; }
        
        .key-row { display: flex; gap: 12px; align-items: center; }
        .key-row input { flex: 1; }
        .key-link { 
            white-space: nowrap; font-size: 0.9rem; font-weight: 500; color: var(--st-accent); 
            text-decoration: none; border: 1.5px solid rgba(228,80,58,0.3); border-radius: var(--st-radius); 
            padding: 10px 16px; transition: all 0.2s; 
        }
        .key-link:hover { background: var(--st-accent-soft); border-color: var(--st-accent); }
        
        .combo { position: relative; }
        .combo input[type=text] { padding-right: 44px; }
        .combo-toggle { 
            position: absolute; top: 0; right: 0; height: 100%; width: 44px;
            border: none; background: transparent; color: var(--text-secondary);
            cursor: pointer; font-size: 0.85rem; transition: color 0.2s; 
        }
        .combo-toggle:hover { color: var(--st-accent); }
        
        .combo-menu { 
            position: absolute; z-index: 100; left: 0; right: 0; top: calc(100% + 8px);
            max-height: 280px; overflow-y: auto; margin: 0; padding: 8px; list-style: none;
            background: var(--st-card); border: 1px solid var(--st-border);
            border-radius: var(--st-radius); box-shadow: 0 12px 40px rgba(0,0,0,0.12); 
        }
        [data-theme="dark"] .combo-menu { box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
        .combo-menu[hidden] { display: none; }
        .combo-menu li { padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; }
        .combo-menu li.combo-item:hover, .combo-menu li.combo-item.active { 
            background: var(--st-accent-soft); color: var(--st-accent); font-weight: 500; 
        }
        .combo-empty { color: var(--text-tertiary); cursor: default; font-size: 0.9rem; text-align: center; padding: 16px; }
        
        .toggle-row { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
        .toggle-row input { width: 18px; height: 18px; accent-color: var(--st-accent); cursor: pointer; }
        
        .btn { 
            border: 1px solid var(--accent); border-radius: var(--radius-control); padding: 12px 28px; font-size: 1rem; font-weight: 600;
            cursor: pointer; background: var(--accent); 
            color: #fff; transition: all 0.2s; box-shadow: 0 10px 18px -16px rgba(228, 80, 58, 0.8);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 22px -18px rgba(194, 58, 38, 0.9); background: var(--accent-ink); border-color: var(--accent-ink); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; background: var(--text-secondary); border-color: var(--text-secondary); }
        
        .btn-ghost { background: transparent; color: var(--st-accent); border: 1.5px solid var(--st-accent); box-shadow: none; }
        .btn-ghost:hover { background: var(--st-accent-soft); color: var(--st-accent); box-shadow: none; }
        
        .auth-status { font-size: 0.85rem; padding: 4px 12px; border-radius: 999px; font-weight: 600; }
        .auth-status.ok { background: rgba(16, 185, 129, 0.1); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .auth-status.err { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .badge-set { font-size: 0.75rem; color: #10B981; font-weight: 600; padding: 2px 8px; background: rgba(16,185,129,0.1); border-radius: 6px; }
        
        .help-q { 
            display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
            border-radius: 50%; border: 1.5px solid var(--text-tertiary); color: var(--text-tertiary);
            font-size: 0.8rem; font-weight: 700; cursor: help; vertical-align: middle; position: relative; transition: 0.2s;
        }
        .help-q:hover, .help-q:focus { outline: none; border-color: var(--st-accent); color: var(--st-accent); background: var(--st-accent-soft); }
        
        .help-q[data-tip]:hover::after, .help-q[data-tip]:focus::after {
            content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 12px); transform: translateX(-50%);
            width: max-content; max-width: 320px; white-space: normal; text-align: left;
            background: var(--bg-tertiary); border: 1px solid var(--st-border); color: var(--text-primary);
            padding: 12px 16px; border-radius: var(--st-radius); font-size: 0.85rem; font-weight: 400;
            line-height: 1.6; z-index: 200; box-shadow: 0 12px 30px rgba(0,0,0,0.15); pointer-events: none;
        }
        .help-q[data-tip]:hover::before, .help-q[data-tip]:focus::before {
            content: ''; position: absolute; left: 50%; top: calc(100% + 5px); transform: translateX(-50%);
            border: 7px solid transparent; border-bottom-color: var(--bg-tertiary);
            z-index: 201; pointer-events: none;
        }
        
        details.card > summary { cursor: pointer; font-weight: 600; font-size: 1.05rem; list-style: none; color: var(--text-primary); outline: none; padding-bottom: 4px; }
        details.card > summary::-webkit-details-marker { display: none; }
        details.card > summary::before { content: '▸ '; color: var(--st-accent); display: inline-block; width: 20px; transition: transform 0.2s; }
        details.card[open] > summary::before { content: '▾ '; }
        
        .save-bar { 
            position: sticky; bottom: 0; margin-top: 32px; padding: 24px 0;
            display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex-wrap: wrap;
            background: linear-gradient(to top, var(--bg-secondary) 70%, transparent); 
            z-index: 10;
        }
        .save-hint { font-size: 0.9rem; color: var(--text-tertiary); }
        code { background: var(--bg-tertiary); padding: 2px 6px; border-radius: 6px; font-size: 0.85em; border: 1px solid var(--st-border); }
        
        .toast { 
            position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px) scale(0.95);
            background: var(--text-primary); color: var(--bg-primary); padding: 12px 24px; border-radius: 12px;
            font-size: 0.95rem; font-weight: 500; opacity: 0; pointer-events: none; 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 2000;
            box-shadow: 0 12px 32px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        
        body.has-app-shell .st-page { width: min(100%, 1000px); max-width: none; padding: 2rem 2.5rem 6rem; }
        body.has-app-shell .st-head { margin-bottom: 2rem; }
        body.has-app-shell .st-head h1 { font-family: var(--font-display); font-size: 2.2rem; }
        body.has-app-shell #groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
        body.has-app-shell #groups .card { margin-top: 0; }
        body.has-app-shell #groups details.card { grid-column: 1 / -1; }
        body.has-app-shell .save-bar { background: linear-gradient(to top, var(--bg-primary) 70%, transparent); padding-right: 24px; }
        
        @media (max-width: 900px) { 
            body.has-app-shell #groups { grid-template-columns: 1fr; gap: 20px; } 
            body.has-app-shell .st-page { padding: 1.5rem 1.5rem 5rem; }
        }
        @media (max-width: 600px) { 
            .st-page { padding: 24px 16px 80px; } 
            .key-row { flex-direction: column; align-items: stretch; } 
            .card { padding: 20px 24px; }
        }

    </style>

    (function () {
        var TOKEN_KEY = 'vta_settings_token';
        var WORKBENCH_TOKEN_KEY = 'vta_bearer_token';
        var ENCRYPTION_KEY = 'vta_encrypt_key_2024';
        var providers = [];
        var lastServerGroups = null;

        function $(id) { return document.getElementById(id); }
        function q(key) { return document.querySelector('[data-key="' + key + '"]'); }
        function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2400); }
        function getToken() { return $('token').value.trim(); }
        function authHeaders() { return { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' }; }
        function encryptToken(text) {
            if (!text) return '';
            try {
                var encoded = btoa(unescape(encodeURIComponent(text + ENCRYPTION_KEY)));
                return encoded.split('').reverse().join('');
            } catch (e) {
                return text;
            }
        }

        function fieldHTML(f) {
            var key = esc(f.key);
            if (f.type === 'bool') {
                return '<div class="field"><label class="toggle-row"><input type="checkbox" data-key="' + key + '"> ' + esc(f.label) + '</label>' +
                    (f.help ? '<div class="hint">' + esc(f.help) + '</div>' : '') + '</div>';
            }
            var badge = (f.type === 'secret') ? ' <span class="badge-set" style="display:none;">已配置</span>' : '';
            var control;
            if (f.control === 'select') {
                control = '<select data-key="' + key + '" disabled></select>';
            } else if (f.type === 'select') {
                control = '<select data-key="' + key + '">' + (f.options || []).map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>';
            } else if (f.type === 'model') {
                control = '<div class="combo"><input type="text" data-key="' + key + '" autocomplete="off" placeholder="选择或手动输入模型名">' +
                    '<button type="button" class="combo-toggle" tabindex="-1" aria-label="展开模型列表">▾</button>' +
                    '<ul class="combo-menu" hidden></ul></div>';
            } else if (f.type === 'int') {
                control = '<input type="number" data-key="' + key + '" autocomplete="off">';
            } else if (f.type === 'secret') {
                // 密钥 + 旁边一键获取链接（provider_key_link 的链接随服务商更新）
                var link = f.provider_key_link
                    ? '<a class="key-link" id="llm-key-link" target="_blank" rel="noopener" style="display:none;"></a>'
                    : (f.key_url ? '<a class="key-link" href="' + esc(f.key_url) + '" target="_blank" rel="noopener">获取 ↗</a>' : '');
                control = '<div class="key-row"><input type="password" data-key="' + key + '" autocomplete="new-password">' + link + '</div>';
            } else {
                control = '<input type="text" data-key="' + key + '" autocomplete="off">';
            }
            return '<div class="field"><label>' + esc(f.label) + badge + '</label>' + control +
                (f.help ? '<div class="hint">' + esc(f.help) + '</div>' : '') + '</div>';
        }

        function providerCtrlHTML() {
            return '<div class="field"><label for="provider">服务商</label>' +
                '<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">' +
                '<select id="provider" style="flex:1; min-width:200px;">' + providers.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('') + '</select>' +
                '<button type="button" class="btn btn-ghost" id="fetch-models-btn" title="用当前 API Key 从服务商实时拉取可用模型（模型在迭代，离线候选仅作兜底）">拉取可用模型</button>' +
                '</div></div>';
        }

        function renderGroups(groups) {
            var core = groups.filter(function (g) { return g.tier !== 'advanced'; });
            var adv = groups.filter(function (g) { return g.tier === 'advanced'; });

            var coreHTML = core.map(function (g) {
                return '<section class="card"><h2>' + esc(g.icon) + ' ' + esc(g.title) +
                    (g.provider ? ' <span class="badge-set" id="current-provider" style="display:none;"></span>' : '') + '</h2>' +
                    (g.desc ? '<div class="card-sub">' + esc(g.desc) + '</div>' : '') +
                    (g.provider ? providerCtrlHTML() : '') +
                    g.fields.map(fieldHTML).join('') + '</section>';
            }).join('');

            var advHTML = adv.length ? '<details class="card"><summary>高级设置（不懂可忽略，留空即用默认值）</summary>' +
                adv.map(function (g) {
                    return '<div class="adv-block"><h3>' + esc(g.icon) + ' ' + esc(g.title) + '</h3>' +
                        (g.desc ? '<div class="card-sub">' + esc(g.desc) + '</div>' : '') +
                        g.fields.map(fieldHTML).join('') + '</div>';
                }).join('') + '</details>' : '';

            $('groups').innerHTML = coreHTML + advHTML;

            var sel = $('provider');
            if (sel) { sel.addEventListener('change', function () { applyProvider(true); }); applyProvider(true); }
        }

        // 模型下拉：自定义组合框，替代会被当前值过滤的原生 datalist。
        // ▾ 永远展示完整候选；打字才过滤；点选填入；仍允许手动输入任意模型名。
        var modelOptions = [];
        function setModelOptions(models) {
            modelOptions = (models || []).slice();
            document.querySelectorAll('.combo').forEach(function (combo) {
                var menu = combo.querySelector('.combo-menu');
                if (menu && !menu.hidden) renderComboMenu(combo, true);
            });
        }
        function renderComboMenu(combo, showAll) {
            var input = combo.querySelector('input[data-key]');
            var menu = combo.querySelector('.combo-menu');
            var typed = showAll ? '' : input.value.trim().toLowerCase();
            var list = modelOptions.filter(function (m) { return !typed || m.toLowerCase().indexOf(typed) >= 0; });
            if (!list.length) {
                menu.innerHTML = '<li class="combo-empty">' +
                    (modelOptions.length ? '无匹配项，可直接使用输入的名称' : '该服务商暂无预置模型，请手动输入') + '</li>';
                return;
            }
            var cur = input.value;
            menu.innerHTML = list.map(function (m) {
                return '<li class="combo-item' + (m === cur ? ' active' : '') + '" data-val="' + esc(m) + '">' + esc(m) + '</li>';
            }).join('');
        }
        function openCombo(combo, showAll) { closeAllCombos(combo); renderComboMenu(combo, showAll); combo.querySelector('.combo-menu').hidden = false; }
        function closeCombo(combo) { var m = combo.querySelector('.combo-menu'); if (m) m.hidden = true; }
        function closeAllCombos(except) { document.querySelectorAll('.combo').forEach(function (c) { if (c !== except) closeCombo(c); }); }

        // 实时拉取服务商可用模型（模型持续迭代）；失败则保留离线候选与手动输入。
        async function fetchProviderModels() {
            if (!getToken()) { toast('请先输入管理口令'); return; }
            var baseEl = q('llm.base_url'), keyEl = q('llm.api_key');
            var body = { base_url: baseEl ? baseEl.value.trim() : '', api_key: keyEl ? keyEl.value.trim() : '' };
            if (!body.base_url) { toast('请先填写 API Base URL'); return; }
            var btn = $('fetch-models-btn');
            if (btn) { btn.disabled = true; btn.textContent = '拉取中…'; }
            try {
                var resp = await fetch('/api/settings/provider-models', { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
                var json = await resp.json();
                if (resp.ok && json.code === 200 && json.data && (json.data.models || []).length) {
                    setModelOptions(json.data.models);
                    toast('已拉取 ' + json.data.models.length + ' 个可用模型');
                } else {
                    toast(json.message || json.detail || '拉取失败，已保留离线候选');
                }
            } catch (e) { toast('网络错误，拉取失败'); }
            finally { if (btn) { btn.disabled = false; btn.textContent = '拉取可用模型'; } }
        }

        // 选择/初始化服务商：填 Base URL、模型候选、获取链接
        function applyProvider(resetToProviderDefaults) {
            var sel = $('provider'); if (!sel) return;
            var p = providers.find(function (x) { return x.id === sel.value; });
            if (!p) return;
            var baseEl = q('llm.base_url');
            if (resetToProviderDefaults && baseEl && p.base_url) baseEl.value = p.base_url;
            setModelOptions(p.models);
            if (resetToProviderDefaults) {
                var c = q('llm.calibrate_model'), s = q('llm.summary_model');
                if (c) c.value = (p.models && p.models[0]) || '';
                if (s) s.value = (p.models && (p.models[1] || p.models[0])) || '';
            }
            var link = $('llm-key-link');
            if (link) {
                if (p.api_key_url) { link.href = p.api_key_url; link.textContent = '获取 ' + p.name + ' Key ↗'; link.style.display = ''; }
                else link.style.display = 'none';
            }
        }

        function fillValues(groups) {
            var baseUrl = '';
            groups.forEach(function (g) {
                g.fields.forEach(function (f) {
                    var el = q(f.key); if (!el) return;
                    if (el.type === 'checkbox') { el.checked = !!f.value; }
                    else if (f.type === 'secret') { el.value = ''; el.placeholder = f.set ? (f.masked + '（已配置，留空不改）') : '未配置'; }
                    else { el.value = (f.value == null ? '' : f.value); if (f.key === 'llm.base_url') baseUrl = el.value; }
                    var badge = el.closest('.field') ? el.closest('.field').querySelector('.badge-set') : null;
                    if (badge) badge.style.display = f.set ? '' : 'none';
                });
            });
            // 按当前 base_url 预选服务商，并据此填模型候选
            var sel = $('provider');
            if (sel) {
                var matched = providers.find(function (p) { return p.base_url && p.base_url === baseUrl; });
                sel.value = matched ? matched.id : 'custom';
                var p = providers.find(function (x) { return x.id === sel.value; }) || { models: [] };
                setModelOptions(p.models);
                var link = $('llm-key-link');
                if (link) { if (p.api_key_url) { link.href = p.api_key_url; link.textContent = '获取 ' + p.name + ' Key ↗'; link.style.display = ''; } else link.style.display = 'none'; }
                var cur = $('current-provider');
                if (cur) { if (baseUrl) { cur.textContent = '当前：' + p.name; cur.style.display = ''; } else cur.style.display = 'none'; }
            }
        }

        function setConcurrencyOptions(limits) {
            [
                ['concurrent.local_asr_workers', limits.local_asr_workers],
                ['concurrent.cloud_asr_workers', limits.cloud_asr_workers]
            ].forEach(function (entry) {
                var el = q(entry[0]);
                var max = Number(entry[1]);
                if (!el || !Number.isInteger(max) || max < 1) return;
                var options = [];
                for (var value = 1; value <= max; value += 1) {
                    options.push('<option value="' + value + '">' + value + '</option>');
                }
                el.innerHTML = options.join('');
                el.disabled = false;
            });
        }

        function setConcurrencyDisabled(disabled) {
            ['concurrent.local_asr_workers', 'concurrent.cloud_asr_workers'].forEach(function (key) {
                var el = q(key);
                if (el) el.disabled = disabled;
            });
        }

        function showAuth(ok, text) { var el = $('auth-status'); el.style.display = ''; el.textContent = text; el.className = 'auth-status ' + (ok ? 'ok' : 'err'); }

        async function init() {
            try {
                var resp = await fetch('/api/settings/schema');
                var json = await resp.json();
                providers = json.data.providers || [];
                renderGroups(json.data.groups || []);
            } catch (e) { $('groups').innerHTML = '<div class="card">加载配置结构失败，请刷新。</div>'; return; }
            var saved = localStorage.getItem(TOKEN_KEY);
            if (saved) { $('token').value = saved; loadValues(); }
        }

        async function loadValues() {
            if (!getToken()) { toast('请先输入管理口令'); return; }
            try {
                var resp = await fetch('/api/settings', { headers: authHeaders() });
                if (resp.status === 401) { showAuth(false, '口令无效'); return; }
                var json = await resp.json();
                if (json.code !== 200) { showAuth(false, json.message || '加载失败'); return; }
                showAuth(true, '已加载');
                providers = json.data.providers || providers;
                setConcurrencyOptions(json.data.concurrency_limits || {});
                fillValues(json.data.groups || []);
                lastServerGroups = json.data.groups || [];
                localStorage.setItem(TOKEN_KEY, getToken());
                localStorage.setItem(WORKBENCH_TOKEN_KEY, encryptToken(getToken()));
            } catch (e) { showAuth(false, '网络错误'); }
        }

        async function saveSettings() {
            if (!getToken()) { toast('请先输入管理口令'); return; }
            var payload = {};
            document.querySelectorAll('[data-key]').forEach(function (el) {
                payload[el.getAttribute('data-key')] = (el.type === 'checkbox') ? el.checked : el.value;
            });
            $('save-btn').disabled = true;
            setConcurrencyDisabled(true);
            try {
                var resp = await fetch('/api/settings', { method: 'POST', headers: authHeaders(), body: JSON.stringify(payload) });
                var json = await resp.json();
                if (resp.ok && json.code === 200) {
                    toast('并发设置已立即生效；其它设置重启后生效');
                    providers = json.data.providers || providers;
                    setConcurrencyOptions(json.data.concurrency_limits || {});
                    fillValues(json.data.groups || []);
                    lastServerGroups = json.data.groups || [];
                } else {
                    if (lastServerGroups) fillValues(lastServerGroups);
                    toast(json.detail || json.message || '保存失败');
                }
            } catch (e) {
                if (lastServerGroups) fillValues(lastServerGroups);
                toast('网络错误，保存失败');
            }
            finally { $('save-btn').disabled = false; setConcurrencyDisabled(false); }
        }

        // 组合框交互：▾ 展开全部候选 / 输入实时过滤 / 点选填入 / 点击外部或 Esc 关闭
        document.addEventListener('click', function (e) {
            if (e.target.closest('#fetch-models-btn')) { fetchProviderModels(); return; }
            var toggle = e.target.closest('.combo-toggle');
            if (toggle) { var cb = toggle.closest('.combo'); cb.querySelector('.combo-menu').hidden ? openCombo(cb, true) : closeCombo(cb); return; }
            var item = e.target.closest('.combo-menu .combo-item');
            if (item) { var c = item.closest('.combo'); c.querySelector('input[data-key]').value = item.getAttribute('data-val'); closeCombo(c); return; }
            if (!e.target.closest('.combo')) closeAllCombos(null);
        });
        document.addEventListener('input', function (e) {
            var cb = e.target.closest && e.target.closest('.combo');
            if (cb && e.target.matches('input[data-key]')) openCombo(cb, false);
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAllCombos(null); });

        $('load-btn').addEventListener('click', loadValues);
        $('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadValues(); });
        $('save-btn').addEventListener('click', saveSettings);
        init();
    })();
    </script>
</body>
</html>
