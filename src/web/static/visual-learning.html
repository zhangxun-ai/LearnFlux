        (function() {
            try {
                var theme = localStorage.getItem('vta_theme_preference');
                if (theme) {
                    var parsedTheme = theme;
                    try { parsedTheme = JSON.parse(theme); } catch(e) {}
                    document.documentElement.setAttribute('data-theme', parsedTheme);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch(e) {}
        })();
    </script>

        <h1 class="sr-only">图解生成</h1>
        <section class="vl-workbench">
            <aside class="vl-control-pane" aria-label="图解输入与设置">
                <div class="vl-source-tabs" role="tablist" aria-label="内容来源">
                    <button class="is-active" id="visual-source-text" type="button" data-source-mode="text" aria-selected="true">粘贴文字</button>
                    <button id="visual-source-file" type="button" data-source-mode="file" aria-selected="false">上传文档</button>
                </div>

                <section class="vl-source-panel is-active" id="visual-text-panel">
                    <label for="visual-text-title">标题</label>
                    <input id="visual-text-title" type="text" maxlength="160" placeholder="可选，留空时使用正文首行">
                    <label for="visual-text-content">正文</label>
                    <textarea id="visual-text-content" maxlength="200000" rows="12" placeholder="粘贴文章、课程笔记或其他文字"></textarea>
                </section>

                <section class="vl-source-panel" id="visual-file-panel" hidden>
                    <input id="visual-file-input" type="file" accept=".pdf,.docx,.txt,.md,.markdown,.html,.htm" hidden>
                    <button class="vl-file-drop" id="visual-file-drop" type="button">
                        <strong id="visual-file-name">选择文档</strong>
                        <span>PDF / DOCX / TXT / Markdown / HTML</span>
                    </button>
                </section>

                <div class="vl-control-grid">
                    <label for="visual-diagram-type">图解类型</label>
                    <select id="visual-diagram-type">
                        <option value="auto">自动推荐</option>
                        <option value="concept_chain">概念链</option>
                        <option value="process_flow">流程图</option>
                        <option value="comparison">对比图</option>
                        <option value="hierarchy">层级图</option>
                        <option value="timeline">时间线</option>
                        <option value="mind_map">思维导图</option>
                    </select>
                    <label for="visual-style">视觉主题</label>
                    <select id="visual-style">
                        <option value="study-notes">学霸笔记</option>
                        <option value="clean-lecture">清晰讲义</option>
                        <option value="chalkboard">黑板手记</option>
                        <option value="technical-blueprint">技术蓝图</option>
                    </select>
                </div>

                <button class="vl-generate" id="visual-generate" type="button" disabled>生成图解</button>
                <div class="vl-job-status" id="visual-job-status" role="status" aria-live="polite">
                    <strong id="visual-progress-stage"></strong>
                    <span id="visual-progress-meta"></span>
                    <div class="vl-progress-track" aria-hidden="true"><i id="visual-progress-fill"></i></div>
                </div>

                <section class="vl-history-section">
                    <header><h2>最近生成</h2><button id="visual-history-refresh" type="button" aria-label="刷新历史">↻</button></header>
                    <div class="vl-history" id="visual-history"></div>
                </section>
            </aside>

            <section class="vl-output-pane" aria-label="图解画布">
                <header class="vl-output-toolbar">
                    <button class="vl-reader-exit" id="visual-reader-exit" type="button" hidden>← 返回生成</button>
                    <div class="vl-output-heading">
                        <h2 id="visual-output-title"></h2>
                    </div>
                    <div class="vl-reading-status" aria-live="polite">
                        <span>正在阅读</span>
                        <strong id="visual-current-section">尚未开始</strong>
                    </div>
                    <div class="vl-reading-progress-wrap">
                        <div><span>全文进度</span><output id="visual-reading-progress-label">0%</output></div>
                        <div class="vl-reading-progress" id="visual-reading-progress" role="progressbar" aria-label="全文阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <i id="visual-reading-progress-fill"></i>
                        </div>
                    </div>
                </header>
                <div class="vl-recommendations" id="visual-recommendations" hidden></div>
                <nav class="vl-page-navigation" id="visual-page-navigation" aria-label="图解页面" hidden></nav>
                <div class="vl-canvas" id="visual-canvas">
                    <div class="vl-canvas-empty"><span>选择内容后生成图解</span></div>
                </div>
            </section>
        </section>
    </main>

    <div class="vl-evidence-layer" id="visual-evidence-layer" hidden>
        <button class="vl-evidence-overlay" id="visual-evidence-overlay" type="button" aria-label="关闭原文依据"></button>
        <aside class="vl-evidence-drawer" id="visual-evidence-drawer" role="dialog" aria-modal="true" aria-labelledby="visual-evidence-title">
            <header>
                <div><span id="visual-evidence-position">原文依据</span><h2 id="visual-evidence-title">章节依据</h2></div>
                <button id="visual-evidence-close" type="button" aria-label="关闭原文依据">×</button>
            </header>
            <p class="vl-evidence-claim" id="visual-evidence-claim"></p>
            <div class="vl-evidence-list" id="visual-evidence-list"></div>
        </aside>
    </div>
