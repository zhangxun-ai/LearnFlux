<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F6F8FB">
    <meta name="description" content="LearnFlux 复盘模块本地 UI 实验区">
    <title>LearnFlux UI Lab · 复盘模块</title>
    <link rel="icon" type="image/png" href="/static/icon/learnflux-favicon-32.png">
    <link rel="stylesheet" href="/static/css/review-ui-lab.css?v={{ asset_version }}">
    <script src="/static/js/review-ui-lab.js?v={{ asset_version }}" defer></script>
</head>
<body class="review-ui-lab-page">
    <main class="review-ui-lab" data-variant="a" data-preview="auto" data-state="ready" data-inspect="false">
        <header class="review-lab-toolbar" aria-label="复盘 UI 实验控制台">
            <strong class="review-lab-toolbar-title">复盘预览</strong>

            <div class="review-lab-control-group">
                <span class="review-lab-control-label">布局</span>
                <div class="review-lab-segmented" role="group" aria-label="选择布局">
                    <button type="button" data-variant-choice="a" aria-pressed="true">A 引导</button>
                    <button type="button" data-variant-choice="b" aria-pressed="false">B 对照</button>
                    <button type="button" data-variant-choice="c" aria-pressed="false">C 专注</button>
                </div>
            </div>

            <div class="review-lab-control-group">
                <span class="review-lab-control-label">页面</span>
                <label class="review-lab-select-label">
                    <span class="sr-only">选择复盘页面</span>
                    <select data-view-choice>
                        <option value="daily">今日复盘</option>
                        <option value="weekly">周度复盘</option>
                        <option value="monthly">月度复盘</option>
                        <option value="annual">年度复盘</option>
                        <option value="insights">内在洞察</option>
                    </select>
                </label>
            </div>

            <div class="review-lab-control-group review-lab-preview-control">
                <span class="review-lab-control-label">画布</span>
                <div class="review-lab-segmented" role="group" aria-label="选择预览宽度">
                    <button type="button" data-preview-choice="auto" aria-pressed="true">自适应</button>
                    <button type="button" data-preview-choice="desktop" aria-pressed="false">桌面</button>
                    <button type="button" data-preview-choice="mobile" aria-pressed="false">手机</button>
                </div>
            </div>

            <div class="review-lab-control-group review-lab-state-control">
                <span class="review-lab-control-label">数据</span>
                <div class="review-lab-segmented" role="group" aria-label="切换模拟数据状态">
                    <button type="button" data-state-choice="ready" aria-pressed="true">正常</button>
                    <button type="button" data-state-choice="empty" aria-pressed="false">空</button>
                    <button type="button" data-state-choice="loading" aria-pressed="false">加载</button>
                    <button type="button" data-state-choice="error" aria-pressed="false">失败</button>
                </div>
            </div>

            <button class="review-lab-compare-button" type="button" data-compare-toggle aria-pressed="false">并排查看</button>
            <a class="review-lab-exit" href="/ui-lab/review" data-inspect-exit>进入体验</a>
        </header>

        <section class="review-lab-canvas" aria-label="复盘模块预览">
            <div class="review-lab-frame">
                <article class="review-lab-workspace" id="review-lab-workspace" data-variant="a" aria-label="LearnFlux 复盘页面">
                    <a class="mock-skip-link" href="#review-lab-view-content">跳到复盘内容</a>

                    <aside class="mock-global-nav" aria-label="应用导航">
                        <div class="mock-brand">
                            <span class="mock-brand-mark" aria-hidden="true"><img src="/static/icon/learnflux-icon-256.png" alt=""></span>
                            <strong>LearnFlux</strong>
                        </div>

                        <nav class="mock-global-links" aria-label="主导航">
                            <section class="mock-nav-group">
                                <span class="mock-nav-group-label">核心工具</span>
                                <button type="button" data-mock-action="unavailable" aria-label="单篇深度学习" title="单篇深度学习">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-2 9h9l-9 11 2-9H4l9-11z"/></svg>
                                    <strong>单篇深度学习</strong>
                                </button>
                                <button type="button" data-mock-action="unavailable" aria-label="系列深度学习" title="系列深度学习">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>
                                    <strong>系列深度学习</strong>
                                </button>
                                <button type="button" data-mock-action="unavailable" aria-label="图解生成" title="图解生成">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                                    <strong>图解生成</strong>
                                </button>
                                <button type="button" data-mock-action="unavailable" aria-label="边播边学" title="边播边学">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 12 8-12 8V4Z"/></svg>
                                    <strong>边播边学</strong>
                                </button>
                                <div class="mock-review-branch">
                                    <button class="is-active" type="button" aria-current="page" aria-label="复盘" title="复盘">
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M7 7h5m0 10h5"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                                        <strong>复盘</strong>
                                        <svg class="mock-nav-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
                                    </button>
                                    <div class="mock-review-subitems" aria-label="复盘二级导航">
                                        <button type="button" data-workspace-view="daily">今日复盘</button>
                                        <button type="button" data-workspace-view="weekly">周度复盘</button>
                                        <button type="button" data-workspace-view="monthly">月度复盘</button>
                                        <button type="button" data-workspace-view="annual">年度复盘</button>
                                        <button type="button" data-workspace-view="insights">内在洞察</button>
                                    </div>
                                </div>
                            </section>

                            <section class="mock-nav-group">
                                <span class="mock-nav-group-label">心流空间</span>
                                <button type="button" data-mock-action="unavailable" aria-label="心流阅读" title="心流阅读">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2V3Zm20 0h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7V3Z"/></svg>
                                    <strong>心流阅读</strong>
                                </button>
                                <button type="button" data-mock-action="unavailable" aria-label="心流写作" title="心流写作">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z"/><path d="m15 5 4 4"/></svg>
                                    <strong>心流写作</strong>
                                </button>
                            </section>
                        </nav>

                        <div class="mock-global-foot">
                            <button type="button" data-mock-action="settings" aria-label="系统设置" title="系统设置">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 1 1-7-7"/></svg>
                                <strong>系统设置</strong>
                            </button>
                        </div>
                    </aside>

                    <div class="mock-review-product">
                        <header class="mock-product-topbar">
                            <div class="mock-mobile-brand" aria-label="LearnFlux">
                                <span aria-hidden="true"><img src="/static/icon/learnflux-icon-256.png" alt=""></span>
                                <strong>LearnFlux</strong>
                            </div>
                            <button class="mock-mobile-menu" type="button" aria-label="打开导航" data-mobile-menu>
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                            </button>
                            <div class="mock-topbar-context">
                                <strong>复盘</strong>
                                <span class="mock-save-line" role="status" aria-live="polite">
                                    <i aria-hidden="true"></i><span data-save-label>已保存</span>
                                </span>
                            </div>
                            <button class="mock-icon-button" type="button" aria-label="搜索复盘记录" data-mock-action="search">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                            </button>
                        </header>

                        <nav class="mock-review-nav" aria-label="复盘功能导航">
                            <button type="button" data-workspace-view="daily">今日</button>
                            <button type="button" data-workspace-view="weekly">周度</button>
                            <button type="button" data-workspace-view="monthly">月度</button>
                            <button type="button" data-workspace-view="annual">年度</button>
                            <button type="button" data-workspace-view="insights">内在洞察</button>
                        </nav>

                        <main class="mock-review-main" id="main-content">
                            <header class="mock-view-header">
                                <div class="mock-view-heading">
                                    <span data-view-kicker>今天</span>
                                    <h1 data-view-title>今日复盘</h1>
                                    <span class="mock-view-save mock-save-line" role="status" aria-live="polite">
                                        <i aria-hidden="true"></i><span data-save-label>已保存</span>
                                    </span>
                                </div>
                                <div class="mock-view-actions">
                                    <button class="mock-icon-button mock-desktop-search" type="button" aria-label="搜索复盘记录" data-mock-action="search">
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                                    </button>
                                    <div class="mock-period-control" aria-label="周期切换">
                                        <button type="button" aria-label="上一周期" data-period-change="-1">←</button>
                                        <strong data-view-period>8 月 25 日</strong>
                                        <button type="button" aria-label="下一周期" data-period-change="1">→</button>
                                    </div>
                                    <button class="mock-primary-action" type="button" data-mock-action="primary">新增记录</button>
                                </div>
                            </header>

                            <section class="mock-state-panel" data-state-panel hidden aria-live="polite">
                                <div class="mock-state-mark" aria-hidden="true"></div>
                                <span data-state-kicker></span>
                                <h2 data-state-title></h2>
                                <p data-state-description></p>
                                <button type="button" data-state-recover>重新载入</button>
                            </section>

                            <section class="mock-view-content" id="review-lab-view-content" aria-live="polite"></section>
                        </main>
                    </div>

                    <div class="mock-mobile-backdrop" data-mobile-backdrop hidden></div>
                </article>
            </div>
        </section>

        <section class="review-lab-comparison" data-comparison hidden aria-label="三种布局并排查看">
            <div class="review-lab-comparison-grid" data-comparison-grid></div>
        </section>

        <section class="mock-search-panel" data-search-panel hidden aria-label="搜索复盘记录">
            <header>
                <div><span>搜索</span><h2>找到过去的自己</h2></div>
                <button type="button" aria-label="关闭搜索" data-search-close>×</button>
            </header>
            <label>
                <span class="sr-only">输入关键词</span>
                <input type="search" value="表达" placeholder="搜索事件、感受或行动" data-search-input>
            </label>
            <div data-search-results></div>
        </section>
        <div class="mock-overlay" data-search-overlay hidden></div>

        <div class="review-lab-toast" data-lab-toast role="status" aria-live="polite" hidden></div>
    </main>
</body>
</html>
